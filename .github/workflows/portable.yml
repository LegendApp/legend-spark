name: Portable gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-app:
    name: Packed npm creator smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun tests/create-packed.integration.ts

  portable:
    name: Source and package gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
        # A full run takes up to about 8.5 minutes on macOS runners; a hung run fails here instead of at the 6-hour job limit.
        timeout-minutes: 20
      # A test step that hangs after its tests finish is usually held open by a process a test left behind.
      - name: Processes left running
        if: failure()
        run: ps -U "$(id -u)" -o pid,ppid,etime,pcpu,command
