appId: so.legend.spark.examples.kitchensink
name: React Native Pressable with OS pointer input
intent: >
  A real mouse down and up must reach React Native's Pressable and fire onPress.
  Two consecutive taps must each release the press and increment the count.
checks: [COMP-POINTER-01]
tags: [component-library]
platforms: [macos]
---
- launchApp: { clearState: true, openUrl: "spark-ks://component-library/pressable-opacity" }
- extendedWaitUntil: { visible: { id: component-library-pressable-opacity-rn-presses-0 }, timeout: 10s }
- tapOn: { id: component-library-pressable-opacity-rn }
- extendedWaitUntil: { visible: { id: component-library-pressable-opacity-rn-presses-1 }, timeout: 10s }
- tapOn: { id: component-library-pressable-opacity-rn }
- extendedWaitUntil: { visible: { id: component-library-pressable-opacity-rn-presses-2 }, timeout: 10s }
