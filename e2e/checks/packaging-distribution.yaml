area: packaging-distribution
prefix: DIST
checks:
  # Release bundle hygiene (#153): the gate's bundle audit (scripts/e2e/audit/bundle.ts) runs these against the release
  # artifact, before the flows. Windows parts need a Windows release build and PE/PDB tooling (#51) and report unsupported.
  DIST-HYG-01:
    title: The release runs without Metro; its embedded main.jsbundle and every other script in the bundle are Hermes bytecode
    platforms: [macos, windows]
    blocking: true
    spec: "#153"
    audit: bundle
  DIST-HYG-02:
    title: The release has no source maps, as .map files or sourceMappingURL references in its scripts
    platforms: [macos, windows]
    blocking: true
    spec: "#153"
    audit: bundle
  DIST-HYG-03:
    title: The release has no development, build or test leftovers (.DS_Store, node_modules, fixtures, TypeScript, object files, headers, dSYMs, debug or sanitizer dylibs, keys)
    platforms: [macos, windows]
    blocking: true
    spec: "#153"
    audit: bundle
  DIST-HYG-04:
    title: Every release binary is stripped, with no debug map or DWARF
    platforms: [macos, windows]
    blocking: true
    spec: "#153"
    audit: bundle
  DIST-HYG-05:
    title: Debug symbols ship separately; the build's symbols folder has a dSYM for every binary UUID in the release
    platforms: [macos, windows]
    blocking: true
    spec: "#153"
    audit: bundle
  DIST-HYG-06:
    title: No file in the release contains an absolute path of the build machine (home folders, temporary folders)
    platforms: [macos, windows]
    blocking: true
    spec: "#153"
    audit: bundle
  DIST-HYG-07:
    title: No file in the release contains a credential (private keys, cloud, GitHub, npm, Slack, Stripe or API secret keys)
    platforms: [macos, windows]
    blocking: true
    spec: "#153"
    audit: bundle
  DIST-HYG-08:
    title: Info.plist has the release keys (identifier, package type, name, executable, versions, minimum macOS 14, principal class) and no App Transport Security exemptions for arbitrary loads or a development server (localhost exceptions, NSAllowsLocalNetworking)
    platforms: [macos, windows]
    blocking: true
    spec: "#153"
    audit: bundle
  DIST-HYG-09:
    title: The release fits its size budget (gate.yaml build.<platform>.sizeBudgetMB)
    platforms: [macos, windows]
    blocking: true
    spec: "#153"
    audit: bundle
  DIST-HYG-10:
    title: The release has third-party license notices with a license for each package and every embedded framework
    platforms: [macos, windows]
    blocking: true
    spec: "#153"
    audit: bundle
  # macOS packaging (#151): the gate's package audit (scripts/e2e/audit/package.ts) runs these against the spark package
  # output (gate.yaml build.macos.package; the release harness passes its --artifact ZIP). Spark has no Windows package yet (#51).
  DIST-PKG-01:
    title: The package is one <name>-<version>-<arch>.zip holding only the app, with no extended attributes of the build machine stored in it, and the extracted app's signature verifies (codesign --verify --deep --strict)
    platforms: [macos]
    blocking: true
    spec: "#151"
    audit: package
  DIST-PKG-02:
    title: A <name>-<version>-<arch>-dSYMs.zip next to the package has a dSYM for every binary UUID in the packaged app
    platforms: [macos]
    blocking: true
    spec: "#151"
    audit: package
  DIST-PKG-03:
    title: One version everywhere; the package name, the packaged Info.plist (identifier, version, build number) and spark-runtime.json match the release build the gate tests
    platforms: [macos]
    blocking: true
    spec: "#151"
    audit: package
  DIST-PKG-04:
    title: The package is thin for the target's architecture (the executable has only that architecture, every binary has it) and no binary needs a newer macOS than LSMinimumSystemVersion
    platforms: [macos]
    blocking: true
    spec: "#151"
    audit: package
  DIST-PKG-05:
    title: An app that updates through Sparkle has a signed appcast whose newest item is this build, with matching versions, minimum macOS and architecture, and whose update archive is this package, signed with the app's SUPublicEDKey
    platforms: [macos]
    blocking: true
    spec: "#151"
    audit: package
  DIST-PKG-06:
    title: Installed from the package as a quarantined download, the app has a Developer ID signature with hardened runtime and secure timestamp, is notarized with the ticket stapled, and Gatekeeper accepts it
    platforms: [macos]
    blocking: true
    spec: "#151; needs Developer ID and notarization credentials (spark package); an ad-hoc package (spark package --ad-hoc) fails it"
    audit: package
  DIST-PKG-07:
    title: Extracting the package from a quarantined download passes the quarantine to the app, so Gatekeeper assesses its first launch
    platforms: [macos]
    blocking: true
    spec: "#151"
    audit: package
