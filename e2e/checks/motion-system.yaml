area: motion-system
prefix: MOT
checks:
  MOT-AVAIL-01:
    title: getMotionAvailability() reports available on macOS and MotionView renders the engine's native view
    platforms: [macos]
    blocking: true
    spec: "#174 MOT.core"
    covers:
      - ./motion#getMotionAvailability().available
      - ./motion#MotionView
  MOT-SPRING-01:
    title: Spring presets resolve to SwiftUI's response/bounce parameters and every preset settles at its target
    platforms: [macos]
    blocking: true
    spec: "#174 MOT.core"
    covers:
      - ./motion#spring
      - ./motion#animate
  MOT-INTERRUPT-01:
    title: Interrupting a running timing with a spring keeps the presented value and velocity, and the replaced animation reports finished false
    platforms: [macos]
    blocking: true
    spec: "#174 MOT.core"
    covers:
      - ./motion#timing
      - ./motion#getMotionState
  MOT-HANDOFF-01:
    title: A gesture release velocity seeds the spring; stopMotion freezes and setMotionValues jumps a property, interrupting it
    platforms: [macos]
    blocking: true
    spec: "#174 MOT.core"
    covers:
      - ./motion#stopMotion
      - ./motion#setMotionValues
  MOT-KEYFRAMES-01:
    title: Keyframes pass through each value at its offset with per-segment easing and settle at the last value
    platforms: [macos]
    blocking: true
    spec: "#174 MOT.core"
    covers:
      - ./motion#keyframes
  MOT-SEQUENCE-01:
    title: A sequence chains steps with velocity carried between them, and repeat with reverse plays it back
    platforms: [macos]
    blocking: true
    spec: "#174 MOT.core"
    covers:
      - ./motion#sequence
  MOT-STAGGER-01:
    title: stagger starts each target eachMs apart from the center in one native plan
    platforms: [macos]
    blocking: true
    spec: "#174 MOT.core"
    covers:
      - ./motion#stagger
  MOT-TIMELINE-01:
    title: A timeline step with after previous starts when the previous step's natively solved spring settles
    platforms: [macos]
    blocking: true
    spec: "#174 MOT.core"
    covers:
      - ./motion#timeline
  MOT-DECAY-01:
    title: Decay with a clamp decelerates and springs onto the crossed bound
    platforms: [macos]
    blocking: true
    spec: "#174 MOT.core"
    covers:
      - ./motion#decay
  MOT-SCROLL-01:
    title: A scroll link drives opacity, scale and rotation from the scroll offset with no JavaScript per event, and stops after remove
    platforms: [macos]
    blocking: true
    spec: "#174 MOT.core"
    covers:
      - ./motion#linkScroll
  MOT-JSBLOCK-01:
    title: Blocking the JavaScript thread for 500 ms during an animation drops no more frames than an idle main thread (at most 6 in 2 s at 120 Hz) and stalls none
    platforms: [macos]
    blocking: true
    spec: "#174 MOT.core"
    covers:
      - ./motion#recordMotionFrames
  MOT-CLOCK-01:
    title: The driver's virtual clock freezes motion and advanceClock steps it to deterministic values
    platforms: [macos]
    blocking: true
    spec: "#174 MOT.core, #52 INFRA.driver"
  MOT-UNSUP-01:
    title: On Windows motion is typed unsupported (unsupported-platform, SparkError E_UNSUPPORTED_PLATFORM) with no substitute, layout, presence, backdrop materials, shapes, shader effects and particles included
    platforms: [windows]
    blocking: true
    spec: "#174 MOT.core, #175 MOT.layout, #405 MOT.shaders, follow-ups #237 and #376"
  MOT-PRESENCE-01:
    title: An added MotionView plays enter; a removed MotionPresence child stays mounted while its exit plays and unmounts once it settles
    platforms: [macos]
    blocking: true
    spec: "#175 MOT.layout"
    covers:
      - ./motion#MotionPresence
      - ./motion#MotionView
  MOT-LAYOUT-01:
    title: Siblings reflow with a layout spring when a row is removed or reordered, and a frame layout scales from its previous size, with no JavaScript per frame
    platforms: [macos]
    blocking: true
    spec: "#175 MOT.layout"
    covers:
      - ./motion#MotionView
  MOT-SHARED-01:
    title: A MotionView mounting with a shared id animates from the box where the MotionView it replaces showed, in the same window, and back
    platforms: [macos]
    blocking: true
    spec: "#175 MOT.layout"
    covers:
      - ./motion#MotionView
  MOT-VISUAL-01:
    title: The Springs, Keyframes and timelines, Scroll link and JS block, Layout, presence and shared elements, Visual effects, Backdrop materials, Shapes, Shaders and particles, Text and symbols, and Accessibility, power and lifecycle screens match their approved goldens in light and dark, English and Arabic, with MotionViews at rest or paused by the virtual clock
    platforms: [macos]
    blocking: true
    spec: "docs/e2e-flows.md Visual goldens; #227"
    covers:
      - ./motion#MotionView
  MOT-TELEMETRY-01:
    title: The driver reads a motion's telemetry (kind, settle time, overshoot, samples) and captures the window at progress points of it on the virtual clock, each frame showing the motion at that instant
    platforms: [macos]
    blocking: true
    spec: "#52 INFRA.driver; docs/motion.md Motion telemetry"
    covers:
      - ./motion#MotionView
  MOT-REDUCE-01:
    title: With Reduce Motion on (simulated), a slide jumps and fades in within 200 ms, a shake plays its designed dim pulse, and the instant alternate jumps; off, the slide springs as written
    platforms: [macos]
    blocking: true
    spec: "#177 MOT.a11y"
    covers:
      - ./motion#getMotionEnvironment
      - ./motion#animate
  MOT-POWER-01:
    title: Motion runs at 120 Hz on a 120 Hz display, at 60 Hz on a 60 Hz display, and at 60 Hz in Low Power Mode (simulated displays and power state)
    platforms: [macos]
    blocking: true
    spec: "#177 MOT.a11y"
    covers:
      - ./motion#getMotionEnvironment
  MOT-HIDDEN-01:
    title: While the window is hidden a repeating animation pauses where it is and resumes when shown, and a finite animation jumps to its end and finishes
    platforms: [macos]
    blocking: true
    spec: "#177 MOT.a11y"
    covers:
      - ./motion#animate
  MOT-CANCEL-01:
    title: Unmounting a MotionView during its animation cancels it and the animation reports finished false
    platforms: [macos]
    blocking: true
    spec: "#177 MOT.a11y"
    covers:
      - ./motion#MotionView
  MOT-CUES-01:
    title: A plan's haptic and sound cues are recorded on the frames that show their times (driver runs record cues instead of playing them)
    platforms: [macos]
    blocking: true
    spec: "#177 MOT.a11y"
    covers:
      - ./motion#animate
  MOT-COLOR-01:
    title: A background color animates in OKLCH (halfway from blue to yellow the presented color is a saturated green, not gray), the hue takes the shorter way round, and the view settles at the target's OKLCH coordinates
    platforms: [macos]
    blocking: true
    spec: "#176 MOT.effects"
    covers:
      - ./motion#animate
      - ./motion#timing
      - ./motion#getMotionState
  MOT-EFFECTS-01:
    title: Corner radius, shadow opacity, radius and offset spring together with scale from the values the view's style set, and a blur radius follows a timing curve, each on its own layer key path, settling at its target
    platforms: [macos]
    blocking: true
    spec: "#176 MOT.effects"
    covers:
      - ./motion#animate
      - ./motion#spring
  MOT-3D-01:
    title: rotateX and rotateY turn a view in perspective and settle at their targets
    platforms: [macos]
    blocking: true
    spec: "#176 MOT.effects"
    covers:
      - ./motion#animate
  MOT-MASK-01:
    title: Mask insets wipe content out and back from its leading edge and an iris opens a circle from the centre, as the captures where it starts and ends show
    platforms: [macos]
    blocking: true
    spec: "#176 MOT.effects"
    covers:
      - ./motion#setMotionValues
      - ./motion#animate
  MOT-FXREDUCE-01:
    title: With Reduce Motion on (simulated), a 3D flip changes at once and fades in within 250 ms, and a color animation fades over 200 ms
    platforms: [macos]
    blocking: true
    spec: "#176 MOT.effects, #177 MOT.a11y"
    covers:
      - ./motion#animate
  MOT-MATERIAL-01:
    title: A MotionMaterial crossfades on the engine when its material changes (interruptible, the old material removed once covered), fades its intensity and springs its tint opacity on the compositor, and getMaterialAvailability reports each material, Liquid Glass included, truthfully
    platforms: [macos]
    blocking: true
    spec: "#407 MOT.vibrancy"
    covers:
      - ./motion#MotionMaterial
      - ./motion#getMaterialAvailability
      - ./motion#animate
      - ./motion#getMaterialAvailability(titlebar).available
      - ./motion#getMaterialAvailability(selection).available
      - ./motion#getMaterialAvailability(menu).available
      - ./motion#getMaterialAvailability(popover).available
      - ./motion#getMaterialAvailability(sidebar).available
      - ./motion#getMaterialAvailability(headerView).available
      - ./motion#getMaterialAvailability(sheet).available
      - ./motion#getMaterialAvailability(windowBackground).available
      - ./motion#getMaterialAvailability(hudWindow).available
      - ./motion#getMaterialAvailability(fullScreenUI).available
      - ./motion#getMaterialAvailability(toolTip).available
      - ./motion#getMaterialAvailability(contentBackground).available
      - ./motion#getMaterialAvailability(underWindowBackground).available
      - ./motion#getMaterialAvailability(underPageBackground).available
      - ./motion#getMaterialAvailability(glass).available
      - ./motion#getMaterialAvailability(clearGlass).available
  MOT-MATREDUCE-01:
    title: With Reduce Motion on (simulated), a material crossfade written as a spring plays as a 200 ms fade; Reduce Transparency (simulated) is reported by getMotionEnvironment
    platforms: [macos]
    blocking: true
    spec: "#407 MOT.vibrancy, #177 MOT.a11y"
    covers:
      - ./motion#MotionMaterial
      - ./motion#getMotionEnvironment
  MOT-SHAPE-01:
    title: A MotionShape morphs between a circle, a star and a square (paths subdivided to one structure) with a spring on the compositor, its fill springing in OKLCH; strokeEnd draws a checkmark (half drawn halfway through an ease-in-out timing, read as values) and springs a progress ring; frozen frames at the morph's start and end match their goldens
    platforms: [macos]
    blocking: true
    spec: "#406 MOT.shapes"
    covers:
      - ./motion#MotionShape
      - ./motion#animate
      - ./motion#getMotionState
  MOT-SHAPEREDUCE-01:
    title: With Reduce Motion on (simulated), a shape's spring morph and its drawn stroke change at once and the shape fades in where they land (a 200 ms crossfade)
    platforms: [macos]
    blocking: true
    spec: "#406 MOT.shapes, #177 MOT.a11y"
    covers:
      - ./motion#MotionShape
  MOT-SHADER-01:
    title: A MotionShader's ripple, dissolve, distortion and specular sweep are engine properties that animate, interrupt and settle like any motion (the ripple, distortion and sweep on the compositor, the dissolve as a precompiled Metal mask rendered on the clock's frames), a dissolved card hides at rest, and getShaderEffectAvailability reports each effect truthfully
    platforms: [macos]
    blocking: true
    spec: "#405 MOT.shaders"
    covers:
      - ./motion#MotionShader
      - ./motion#getShaderEffectAvailability
      - ./motion#getShaderEffectAvailability(ripple).available
      - ./motion#getShaderEffectAvailability(dissolve).available
      - ./motion#getShaderEffectAvailability(distortion).available
      - ./motion#getShaderEffectAvailability(specular).available
      - ./motion#animate
      - ./motion#setMotionValues
  MOT-PARTICLE-01:
    title: A MotionEmitter emits from startParticles until stopParticles, or for a burst's duration, reports what played, and getParticleAvailability reports particles truthfully
    platforms: [macos]
    blocking: true
    spec: "#405 MOT.shaders"
    covers:
      - ./motion#MotionEmitter
      - ./motion#startParticles
      - ./motion#stopParticles
      - ./motion#getParticleAvailability
  MOT-SHADREDUCE-01:
    title: With Reduce Motion on (simulated), a ripple changes at once and its card fades in where it is, a dissolve written as a spring plays as a 200 ms fade, and startParticles emits nothing (played none)
    platforms: [macos]
    blocking: true
    spec: "#405 MOT.shaders, #177 MOT.a11y"
    covers:
      - ./motion#MotionShader
      - ./motion#startParticles
  MOT-PATH-01:
    title: motionPath moves a view along an SVG path as keyframes the engine plays on the compositor, turned to the path's heading, and it settles at the path's end
    platforms: [macos]
    blocking: true
    spec: "#176 MOT.effects"
    covers:
      - ./motion#motionPath
      - ./motion#animate
  MOT-NUMBER-01:
    title: MotionNumber rolls only the digits that change, each with a spring on its own MotionView, and shows the formatted number
    platforms: [macos]
    blocking: true
    spec: "#176 MOT.effects"
    covers:
      - ./motion#MotionNumber
  MOT-TEXT-01:
    title: MotionText crossfades changed characters in place and types new text one character after another, settling on the virtual clock
    platforms: [macos]
    blocking: true
    spec: "#176 MOT.effects"
    covers:
      - ./motion#MotionText
  MOT-SYMBOL-01:
    title: Symbol effects (bounce, pulse, wiggle, rotate, breathe, draw off and on) play on a MotionSymbol and report what played, availability reports each effect truthfully, stopping removes them, and a name change replaces the symbol with a transition
    platforms: [macos]
    blocking: true
    spec: "#176 MOT.effects"
    covers:
      - ./motion#MotionSymbol
      - ./motion#playSymbolEffect
      - ./motion#stopSymbolEffects
      - ./motion#getSymbolEffectAvailability
      - ./motion#getSymbolEffectAvailability(bounce).available
      - ./motion#getSymbolEffectAvailability(pulse).available
      - ./motion#getSymbolEffectAvailability(wiggle).available
      - ./motion#getSymbolEffectAvailability(rotate).available
      - ./motion#getSymbolEffectAvailability(breathe).available
      - ./motion#getSymbolEffectAvailability(drawOn).available
      - ./motion#getSymbolEffectAvailability(drawOff).available
      - ./motion#getSymbolEffectAvailability(replace).available
  MOT-SYMREDUCE-01:
    title: With Reduce Motion on (simulated), a symbol bounce plays its pulse alternate and drawing a symbol off or on fades it
    platforms: [macos]
    blocking: true
    spec: "#176 MOT.effects, #177 MOT.a11y"
    covers:
      - ./motion#playSymbolEffect
