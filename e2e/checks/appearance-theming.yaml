area: appearance-theming
prefix: APPR
checks:
  APPR-PREFS-01:
    title: "getSystemAvailability(\"appearancePreferences\") is available on macOS and getAppearancePreferences reports the system appearance and Auto, accent and highlight colors, increase contrast, reduce transparency, reduce motion and differentiate without color as AppKit reads them (settings given as launch arguments; the Mac's settings are untouched)"
    platforms: [macos]
    blocking: true
    spec: "#97 APPR.api"
    covers:
      - ./system#getAppearancePreferences
      - ./system#getSystemAvailability
  APPR-EVENTS-01:
    title: "onSystemEvent delivers appearanceChanged, systemColorsChanged and accessibilityDisplayChanged, and getAppearancePreferences then reports the appearance, accent and highlight colors, contrast, transparency, motion, differentiate-without-color and invert-colors values each event carried (injected with simulateSystemEvent; the OS is untouched)"
    platforms: [macos]
    blocking: true
    spec: "#97 APPR.api"
    covers:
      - ./system#onSystemEvent
      - ./system#getAppearancePreferences
  APPR-WINDOW-01:
    title: "setWindowOptions(windowId, { appearance }) overrides one window's appearance to dark or light and back to the app's, and leaving the screen restores it"
    platforms: [macos]
    blocking: true
    spec: "#97 APPR.api"
    covers:
      - ./windows#setWindowOptions
  APPR-UNSUP-01:
    title: "On Windows getSystemAvailability(\"appearancePreferences\") reports unsupported-platform and the preferences screen shows SparkError:E_UNSUPPORTED_PLATFORM (implementation: #342)"
    platforms: [windows]
    blocking: true
    spec: "#97 APPR.api"
    covers:
      - ./system#getSystemAvailability
  APPR-ICONSIZE-01:
    title: "The release build's app icon has every size macOS draws: Info.plist names the asset catalog icon and the .icns file, the catalog has 32 to 1024 pixel renditions (16 to 512 points at 2x) and the .icns file is valid (assertAppIcon)"
    platforms: [macos]
    blocking: true
    spec: "#99 APPR.icons; macos.icon or expo.icon (docs/configuration.md#app-icons)"
  APPR-ICONSTYLE-01:
    title: "The release build's app icon carries the macOS 26 Icon Composer styles: image stacks for the default, dark and tintable appearances, which the clear and tinted styles render (assertAppIcon styles)"
    platforms: [macos]
    blocking: true
    spec: "#99 APPR.icons; an Icon Composer .icon document in macos.icon"
  APPR-ICONDRAW-01:
    title: "getAppIcon() draws the app's icon as Finder and the Dock show it at 16 to 512 pixels, and in the default, dark, clear and tinted styles (light and dark) each rendering matches its golden; each style is set with -AppleIconAppearanceTheme for the driven process only, never the Mac's settings or Dock"
    platforms: [macos]
    blocking: true
    spec: "#99 APPR.icons"
    covers:
      - ./files#getAppIcon
      - ./files#getAppIconAvailability
      - ./files#getAppIconAvailability().available
  APPR-ICONWIN-01:
    title: "The Windows build's executable icon (its first RT_GROUP_ICON, which Explorer, the taskbar, Start and the title bar draw) has 16, 20, 24, 32, 40, 48, 64 and 256 pixel images (assertAppIcon; first Windows run: #353)"
    platforms: [windows]
    blocking: true
    spec: "#99 APPR.icons; expo.icon (docs/configuration.md#app-icons)"
  APPR-ICONUNSUP-01:
    title: "On Windows getAppIconAvailability() reports unsupported-platform and the App icon screen shows SparkError:E_UNSUPPORTED_PLATFORM from getAppIcon() (implementation: #353)"
    platforms: [windows]
    blocking: true
    spec: "#99 APPR.icons"
    covers:
      - ./files#getAppIconAvailability
      - ./files#getAppIconAvailability().available
