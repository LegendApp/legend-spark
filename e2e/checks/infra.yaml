area: infra
prefix: INFRA
checks:
  INFRA-DRIVER-01:
    title: The in-app driver backend launches the Kitchen Sink without focus, finds the catalog root by testID and matches the catalog golden
    platforms: [macos]
    blocking: true
    spec: "docs/e2e-flows.md The driver backend; #226"
  INFRA-DRIVER-02:
    title: A spark-ks:// URL opened in the running app arrives as a links "url" event and routes to the screen, whose root renders and is captured
    platforms: [macos]
    blocking: true
    spec: "docs/e2e-flows.md The driver backend; #226"
    covers:
      - ./links#addEventListener
  INFRA-DRIVER-03:
    title: launchApp clearState deletes the app's persisted state before launch (a Spark setting and a recent document in its defaults domain are gone), and a plain relaunch keeps it
    platforms: [macos]
    blocking: true
    spec: "docs/e2e-flows.md clearState; #246"
  INFRA-DRIVER-04:
    title: launchApp arguments reach the app's launch arguments
    platforms: [macos]
    blocking: true
    spec: "docs/e2e-flows.md The driver backend; #246"
  INFRA-DRIVER-05:
    title: "launchApp openFile delivers the file to the running app through application:openURLs: as a file open request"
    platforms: [macos]
    blocking: true
    spec: "docs/e2e-flows.md The driver backend; #246"
  INFRA-DRIVER-06:
    title: A driven launch never restores or saves window frames, so the main window opens at its configured size after an earlier launch resized it
    platforms: [macos]
    blocking: true
    spec: "docs/test-driver.md Focus and window state; #246"
  INFRA-SIGNOFF-01:
    title: Launched with --ks-signoff and a sign-off session, the Kitchen Sink opens the sign-off checklist and lists each run with its state (pending with an in-process screenshot, pending without one, not ready, signed off)
    platforms: [macos]
    blocking: true
    spec: "docs/e2e-flows.md Manual sign-offs; #57"
  INFRA-DRIVER-07:
    title: assertStartup reports the launch's startup phases from the process start to the first settled UI showing the catalog, and records startup.coldMs and startup.firstPaintMs
    platforms: [macos]
    blocking: true
    spec: "docs/test-driver.md Startup phases; #52"
  INFRA-DRIVER-08:
    title: assertState reads the state the app exposes with exposeTestState (its navigation and app-wide state), which follows deep links and input
    platforms: [macos]
    blocking: true
    spec: "docs/test-driver.md Exposed state; #52"
    covers:
      - ./app#exposeTestState
  INFRA-DRIVER-09:
    title: assertNoLayoutThrash and assertNoFlicker watch every commit while a click navigates, and no view is laid out twice and no element goes missing
    platforms: [macos]
    blocking: true
    spec: "docs/test-driver.md Layout thrash and flicker; #52"
  INFRA-DRIVER-10:
    title: assertNoLeaks finds the leak counters (windows, views, file descriptors, desktop event listeners) back at their baseline after repeated navigation, and assertMemory records the app's footprint
    platforms: [macos]
    blocking: true
    spec: "docs/test-driver.md Leak counters; #52"
