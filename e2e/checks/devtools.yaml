area: devtools
prefix: DEVT
checks:
  DEVT-MENU-01:
    title: A development bundle publishes the Developer menu before Window, composed with the app's own menus, with Reload, Open DevTools, Toggle Element Inspector, Toggle Performance Monitor, Fast Refresh, Start Profiling, Stop Profiling… and Show Bundle Info, and reports it ready
    platforms: [macos]
    blocking: true
    spec: "docs/menus.md Developer menu; #270"
    covers:
      - ./menus#getDeveloperMenuState
      - ./menus#addDeveloperMenuListener
      - ./menus#createMenu
  DEVT-MENU-02:
    title: The Developer menu claims Ctrl+Cmd+Z (not reserved by macOS, not used by the app) through a hidden item whose key equivalent pops the menu up
    platforms: [macos]
    blocking: true
    spec: "docs/menus.md Developer menu; #270"
    covers:
      - ./menus#getDeveloperMenuState
      - ./shortcuts/commands#getReservedShortcuts
  DEVT-MENU-03:
    title: Developer menu items follow the key window's runtime; with no key window Reload stays enabled and every per-window item is disabled while Start Profiling, which acts on the whole app, stays enabled; Open DevTools is disabled with a tooltip only when no DevTools opener is registered (React Native DevTools registers one in development bundles)
    platforms: [macos]
    blocking: true
    spec: "docs/menus.md Developer menu; #270"
    covers:
      - ./menus#createMenu
  DEVT-MENU-04:
    title: Developer menu titles follow the system language (English, Arabic)
    platforms: [macos]
    blocking: true
    spec: "docs/menus.md Developer menu; #270"
    covers:
      - ./menus#getDeveloperMenuState
  DEVT-MENU-05:
    title: A release JavaScript bundle has no Developer menu, and getDeveloperMenuState reports release-build
    platforms: [macos]
    blocking: true
    spec: "docs/menus.md Developer menu; #270, #274"
    covers:
      - ./menus#getDeveloperMenuState
  DEVT-AVAIL-01:
    title: Without development JavaScript from the development server (release builds included), getDevToolsAvailability reports development-only and the DevTools screen offers no DevTools actions
    platforms: [macos]
    blocking: true
    spec: "#268"
    covers:
      - ./devtools#getDevToolsAvailability
      - ./devtools#getDevToolsAvailability().available
  DEVT-AVAIL-02:
    title: With a development bundle on macOS getDevToolsAvailability reports available and the DevTools screen offers Open DevTools for the shared and the worker runtime
    platforms: [macos]
    blocking: true
    spec: "#268"
    covers:
      - ./devtools#getDevToolsAvailability
      - ./devtools#getDevToolsAvailability().available
  DEVT-UNSUP-01:
    title: On Windows getDevToolsAvailability reports unsupported-platform and openDevTools rejects E_UNSUPPORTED_PLATFORM
    platforms: [windows]
    blocking: true
    spec: "#268"
    covers:
      - ./devtools#getDevToolsAvailability
  DEVT-TARGETS-01:
    title: 'Each JS runtime is a separate debug target at the development server''s /json/list, titled "<app> (shared runtime)" and "<app> (isolated runtime: <name>)"'
    platforms: [macos]
    blocking: true
    spec: "#268"
    covers:
      - ./devtools
  DEVT-DEBUG-01:
    title: Over CDP a target evaluates, reports console calls, pauses at a breakpoint in a source-mapped source file and pauses on uncaught exceptions
    platforms: [macos]
    blocking: true
    spec: "#268"
    covers:
      - ./devtools
  DEVT-RELOAD-01:
    title: A debugger session survives Fast Refresh and a full reload of the shared runtime; an isolated runtime re-registers its target with the same title
    platforms: [macos]
    blocking: true
    spec: "#268"
    covers:
      - ./devtools
  DEVT-OPEN-01:
    title: openDevTools asks the development server to open DevTools for the shared or an isolated runtime's target, rejects E_NOT_FOUND for a runtime that is not running, and ⌥⌘I opens the shared runtime
    platforms: [macos]
    blocking: true
    spec: "#268"
    covers:
      - ./devtools#openDevTools
  DEVT-VISUAL-01:
    title: The DevTools screen matches its goldens in light and dark, English and Arabic
    platforms: [macos]
    blocking: true
    spec: "#268"
    covers:
      - ./devtools
  DEVT-NET-01:
    title: 'With React Native DevTools attached to a development bundle, fetch, XMLHttpRequest and WebSocket traffic reaches its Network panel through the development server: requestWillBeSent with the type (Fetch, XHR, WebSocket) and the initiator''s stack, responseReceived with status, MIME type and the URL that answered after a redirect, dataReceived for each streamed part, loadingFinished or loadingFailed (canceled on abort), Network.getResponseBody with text and binary bodies, and WebSocket handshake, text and binary frames and close'
    platforms: [macos]
    blocking: true
    spec: "docs/devtools.md Network inspector; #271"
    covers:
      - ./devtools
      - ./devtools#getNetworkLog
  DEVT-NET-02:
    title: The inspector changes nothing about a request (the app and the server receive the same bytes, headers, redirects, progress events and aborts); Authorization, Cookie and Set-Cookie read [redacted] in DevTools and the log while the server gets the real values, and bodies and frames keep their first maxBodySize bytes (65536) with their whole size
    platforms: [macos]
    blocking: true
    spec: "docs/devtools.md Network inspector; #271"
    covers:
      - ./devtools#configureNetworkInspector
      - ./devtools#getNetworkLog
  DEVT-NET-03:
    title: With no DevTools session and no network listener the inspector records and reports nothing and listens to no networking events; once DevTools detaches, requests are no longer reported
    platforms: [macos]
    blocking: true
    spec: "docs/devtools.md Network inspector; #271"
    covers:
      - ./devtools#addNetworkListener
      - ./devtools#getNetworkLog
  DEVT-NET-04:
    title: With a development bundle on macOS getNetworkInspectorAvailability reports available and the Network screen offers its loopback scenarios and an empty log
    platforms: [macos]
    blocking: true
    spec: "#271"
    covers:
      - ./devtools#getNetworkInspectorAvailability
      - ./devtools#getNetworkInspectorAvailability().available
      - ./devtools#addNetworkListener
  DEVT-NET-05:
    title: Without a development bundle (release builds included) getNetworkInspectorAvailability reports development-only and the Network screen offers no requests
    platforms: [macos]
    blocking: true
    spec: "#271"
    covers:
      - ./devtools#getNetworkInspectorAvailability
      - ./devtools#getNetworkInspectorAvailability().available
  DEVT-UNSUP-02:
    title: On Windows getNetworkInspectorAvailability reports unsupported-platform and the network inspector functions throw E_UNSUPPORTED_PLATFORM
    platforms: [windows]
    blocking: true
    spec: "#271"
    covers:
      - ./devtools#getNetworkInspectorAvailability
  DEVT-VISUAL-02:
    title: The Network inspector screen matches its goldens in light and dark, English and Arabic
    platforms: [macos]
    blocking: true
    spec: "#271"
    covers:
      - ./devtools
  DEVT-PROF-01:
    title: startProfiling and stopProfiling sample every JavaScript runtime (shared and isolated) with Hermes and write a .cpuprofile per runtime (a runtime that does not answer is reported in missing and the others are kept), its stacks source-mapped through the development server to source files and lines, and one Chrome trace with a track per runtime's sampled stacks, the main thread's display-link frames and each MotionView's animation
    platforms: [macos]
    blocking: true
    spec: "docs/devtools.md Profiling; #272"
    covers:
      - ./devtools#startProfiling
      - ./devtools#stopProfiling
  DEVT-PROF-02:
    title: startProfiling rejects samplesPerSecond outside 1-10000 (E_INVALID_ARGUMENT), unknown options (E_UNSUPPORTED_OPTION) and a second recording (E_BUSY); stopProfiling rejects with nothing recording and for a directory that does not exist (E_NOT_FOUND, still recording) or is relative (E_INVALID_ARGUMENT), writes only into the directory it is given, and without one into a new temporary directory
    platforms: [macos]
    blocking: true
    spec: "docs/devtools.md Profiling; #272"
    covers:
      - ./devtools#startProfiling
      - ./devtools#stopProfiling
  DEVT-PROF-03:
    title: React Native DevTools profiles each runtime's target (Profiler and the Performance panel's Tracing, source-mapped) and its Memory panel takes heap snapshots, allocation timelines and allocation samples scoped to that runtime; a snapshot holds its own runtime's objects and not another's
    platforms: [macos]
    blocking: true
    spec: "docs/devtools.md Heap snapshots and allocation timelines; #272"
    covers:
      - ./devtools
  DEVT-PROF-04:
    title: With a development bundle on macOS getProfilerAvailability reports available; the Profiling screen starts and stops a recording and reports the files it saved, the screen and the Developer menu's Start Profiling and Stop Profiling… items follow the recording whoever started it (isProfiling, addProfilingListener), whatever window is key
    platforms: [macos]
    blocking: true
    spec: "docs/devtools.md Profiling; docs/menus.md Developer menu; #272"
    covers:
      - ./devtools#getProfilerAvailability
      - ./devtools#getProfilerAvailability().available
      - ./devtools#startProfiling
      - ./devtools#stopProfiling
      - ./devtools#isProfiling
      - ./devtools#addProfilingListener
  DEVT-PROF-05:
    title: Without a development bundle (release builds included) getProfilerAvailability reports development-only and the Profiling screen offers no recording
    platforms: [macos]
    blocking: true
    spec: "#272"
    covers:
      - ./devtools#getProfilerAvailability
      - ./devtools#getProfilerAvailability().available
  DEVT-PROF-06:
    title: "assertFrames, the gate's frame budget, records on the same frame timeline: with trace: true it writes the frames, drops and MotionView animations as a Chrome trace artifact, and without it polls no motion"
    platforms: [macos]
    blocking: true
    spec: "docs/devtools.md Frame timeline; #163, #272"
    covers:
      - ./devtools
  DEVT-UNSUP-03:
    title: On Windows getProfilerAvailability reports unsupported-platform and startProfiling and stopProfiling reject E_UNSUPPORTED_PLATFORM
    platforms: [windows]
    blocking: true
    spec: "#272"
    covers:
      - ./devtools#getProfilerAvailability
  DEVT-VISUAL-03:
    title: The Profiling screen matches its goldens in light and dark, English and Arabic
    platforms: [macos]
    blocking: true
    spec: "#272"
    covers:
      - ./devtools
  # Release safety (#274): a running release build has no debug surface. The driver backend's release-safety probe
  # (assertNoDebugSurface, docs/e2e-flows.md#release-safety-probe) checks the gate's artifact, which the release harness
  # installs (bun run harness runs the gate with --artifact <installed app>).
  DEVT-REL-01:
    title: A running release build has no Developer menu and no debug menu item (Reload, Open DevTools, Toggle Element Inspector, Toggle Performance Monitor, Fast Refresh, Start Profiling, Stop Profiling…, Show Bundle Info, or another DevTools, inspector, debugger or profiler item), hidden items included
    platforms: [macos]
    blocking: true
    spec: "#274"
    covers:
      - ./devtools
  DEVT-REL-02:
    title: A running release build listens on no port and holds no network socket; its only bound Unix socket is the test driver's channel
    platforms: [macos]
    blocking: true
    spec: "#274"
    covers:
      - ./devtools
  DEVT-REL-03:
    title: Launched with a development server address (RCT_jsLocation and SPARK_BUNDLE_URL), a release build never connects to it
    platforms: [macos]
    blocking: true
    spec: "#274"
    covers:
      - ./devtools
  DEVT-REL-04:
    title: A release build's JavaScript (its Hermes bundles and scripts) contains no network inspector
    platforms: [macos]
    blocking: true
    spec: "#271, #274"
    covers:
      - ./devtools
  DEVT-REL-05:
    title: A release build contains no profiler, in its JavaScript (Hermes bundles and scripts) or its native code (every Mach-O file)
    platforms: [macos]
    blocking: true
    spec: "#272, #274"
    covers:
      - ./devtools
