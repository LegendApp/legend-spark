area: reliability-diagnostics
prefix: REL
checks:
  REL-LOG-01:
    title: getLoggingAvailability reports logging, the unified log, log files and diagnostics export as available on macOS
    platforms: [macos]
    blocking: true
    spec: "#165 REL.api-log"
    covers:
      - ./logging
      - ./logging#getLoggingAvailability
      - ./logging#getLoggingAvailability().available
  REL-LOG-02:
    title: A logger writes one entry per level (debug through fault) with structured fields; after flushLogs they are JSON lines in app.log, newest first on screen with their level, category, message and fields
    platforms: [macos]
    blocking: true
    spec: "#165 REL.api-log"
    covers:
      - ./logging#createLogger
      - ./logging#flushLogs
      - ./logging#getLogFiles
  REL-LOG-03:
    title: With configureLogging at 4,096-byte files and 3 kept, 100 entries rotate app.log into app.1.log and app.2.log, no app.3.log remains, and every file stays within 4,096 bytes
    platforms: [macos]
    blocking: true
    spec: "#165 REL.api-log"
    covers:
      - ./logging#configureLogging
      - ./logging#getLogFiles
  REL-LOG-04:
    title: exportDiagnostics writes a local zip of diagnostics.json and the log files, without a panel, and reports its entries and size
    platforms: [macos]
    blocking: true
    spec: "#165 REL.api-log"
    covers:
      - ./logging#exportDiagnostics
  REL-LOG-05:
    title: Export diagnostics asks for a destination with a save panel; canceling writes nothing and resolves {"canceled":true}, saving writes the zip there
    platforms: [macos]
    blocking: true
    spec: "#165 REL.api-log"
    covers:
      - ./logging#exportDiagnostics
  REL-LOG-06:
    title: On Windows, logging and each feature report unsupported-platform, and writing entries, flushing and exporting fail with SparkError:E_UNSUPPORTED_PLATFORM
    platforms: [windows]
    blocking: true
    spec: "#165 REL.api-log; Windows implementation in #319"
    covers:
      - ./logging#getLoggingAvailability().available
  REL-LOG-07:
    title: When a file takes the log folder's place, addLoggingErrorListener hears the failure once with a count, hears again when writing resumes with the total, and flushLogs rejects a LogWriteError counting the 2 entries not written
    platforms: [macos]
    blocking: true
    spec: "#165 REL.api-log"
    covers:
      - ./logging#addLoggingErrorListener
      - ./logging#LogWriteError
      - ./logging#flushLogs
  REL-HANG-01:
    title: getHangWatchdogAvailability reports the hang watchdog available on macOS, and the screen's watchdog starts at the default 250 ms threshold
    platforms: [macos]
    blocking: true
    spec: "#166 REL.api-hang"
    covers:
      - ./diagnostics
      - ./diagnostics#getHangWatchdogAvailability
      - ./diagnostics#getHangWatchdogAvailability().available
      - ./diagnostics#startHangWatchdog
  REL-HANG-02:
    title: A 1 s main-thread block is reported once the main thread recovers, with a duration within the watchdog's resolution of the block and a stack that names SparkSimulateHang, every frame located by image, offset and UUID
    platforms: [macos]
    blocking: true
    spec: "#166 REL.api-hang"
    covers:
      - ./diagnostics#startHangWatchdog
      - ./diagnostics#simulateHang
  REL-HANG-03:
    title: A block shorter than the threshold is not reported, a stopped watchdog reports nothing, and a restarted one reports again
    platforms: [macos]
    blocking: true
    spec: "#166 REL.api-hang"
    covers:
      - ./diagnostics#startHangWatchdog
      - ./diagnostics#simulateHang
  REL-HANG-04:
    title: On Windows the hang watchdog reports unsupported-platform, and starting it or simulating a hang rejects SparkError:E_UNSUPPORTED_PLATFORM
    platforms: [windows]
    blocking: true
    spec: "#166 REL.api-hang; Windows implementation in #304"
    covers:
      - ./diagnostics#getHangWatchdogAvailability().available
  REL-CRASH-01:
    title: getCrashReportingAvailability reports crash reporting available on macOS; consent starts off, simulateCrash then rejects SparkError:E_PERMISSION_DENIED, and consent once given survives a relaunch
    platforms: [macos]
    blocking: true
    spec: "#164 REL.api-crash"
    covers:
      - ./diagnostics#getCrashReportingAvailability
      - ./diagnostics#getCrashReportingAvailability().available
      - ./diagnostics#getCrashReportingConsent
      - ./diagnostics#setCrashReportingConsent
      - ./diagnostics#simulateCrash
  REL-CRASH-02:
    title: A bad memory access in a helper process is recorded by its signal handler and reported as SIGSEGV, with a stack that names SparkCrashNow and locates every frame by image, offset and UUID, and getCrashReports lists it
    platforms: [macos]
    blocking: true
    spec: "#164 REL.api-crash"
    covers:
      - ./diagnostics#simulateCrash
      - ./diagnostics#getCrashReports
  REL-CRASH-03:
    title: abort() and an uncaught NSException are reported as SIGABRT (the exception with its name), and a stack overflow as SIGSEGV whose stack names the recursion, recorded on the alternate signal stack
    platforms: [macos]
    blocking: true
    spec: "#164 REL.api-crash"
    covers:
      - ./diagnostics#simulateCrash
      - ./diagnostics#getCrashReports
  REL-CRASH-04:
    title: A fatal JavaScript TypeError is recorded synchronously through the JavaScript handler and reported with its name and the engine's stack
    platforms: [macos]
    blocking: true
    spec: "#164 REL.api-crash"
    covers:
      - ./diagnostics#simulateCrash
      - ./diagnostics#getCrashReports
  REL-CRASH-05:
    title: Reports stay on disk across a relaunch, and deleteCrashReports removes them all
    platforms: [macos]
    blocking: true
    spec: "#164 REL.api-crash"
    covers:
      - ./diagnostics#getCrashReports
      - ./diagnostics#deleteCrashReports
  REL-CRASH-06:
    title: On Windows crash reporting reports unsupported-platform, and reading consent and simulating a crash reject SparkError:E_UNSUPPORTED_PLATFORM
    platforms: [windows]
    blocking: true
    spec: "#164 REL.api-crash; Windows implementation in #343"
    covers:
      - ./diagnostics#getCrashReportingAvailability().available
