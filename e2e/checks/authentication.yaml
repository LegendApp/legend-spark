area: authentication
prefix: AUTH
checks:
  AUTH-AVAIL-01:
    title: "getAppleAuthenticationAvailability and getPasskeyAvailability report missing-entitlement in a build without the entitlements (the Kitchen Sink) and requests reject AuthorizationError E_UNAVAILABLE missingEntitlement before anything is shown; with the entitlements (simulated) both report available"
    platforms: [macos]
    blocking: true
    spec: "#146 AUTH.api"
    covers:
      - ./apple-authentication
      - ./apple-authentication#getAppleAuthenticationAvailability
      - ./apple-authentication#getAppleAuthenticationAvailability().available
      - ./passkeys
      - ./passkeys#getPasskeyAvailability
      - ./passkeys#getPasskeyAvailability().available
      - ./passkeys#AuthorizationError
      - ./apple-authentication#AuthorizationError
  AUTH-SIWA-01:
    title: "signInWithApple presents over the calling window and resolves the credential (user, identity token, the scopes' email and name, the state echoed) or cancel when the person cancels (driver simulation; no sheet, no Apple servers)"
    platforms: [macos]
    blocking: true
    spec: "#146 AUTH.api"
    covers:
      - ./apple-authentication#signInWithApple
      - ./apple-authentication#AppleSignInButton
  AUTH-SIWABUTTON-01:
    title: "AppleSignInButton draws Apple's ASAuthorizationAppleIDButton in each type and style; a press without onPress runs signInWithApple over the button's window and reports the credential, the person's cancel or a typed AuthorizationError (missingEntitlement before any request) through onSignIn and onError (driver simulation; no sheet, no Apple servers)"
    platforms: [macos]
    blocking: true
    spec: "#426 AUTH.button"
    covers:
      - ./apple-authentication#AppleSignInButton
  AUTH-SIWASTATE-01:
    title: "getAppleIDCredentialState reports authorized for the signed-in user and revoked, notFound or transferred as Apple answers (driver simulation; no Apple servers)"
    platforms: [macos]
    blocking: true
    spec: "#146 AUTH.api"
    covers:
      - ./apple-authentication#getAppleIDCredentialState
  AUTH-PASSKEY-01:
    title: "createPasskey registers a passkey for the relying party and getPasskey signs in with it, returning base64url WebAuthn values with the user handle given at registration (driver simulation; no sheet, no relying party)"
    platforms: [macos]
    blocking: true
    spec: "#146 AUTH.api"
    covers:
      - ./passkeys#createPasskey
      - ./passkeys#getPasskey
  AUTH-ERR-01:
    title: "AuthenticationServices failures reject a typed AuthorizationError (failed and notInteractive E_UNAVAILABLE, invalidResponse E_INVALID_DATA, matchedExcludedCredential E_ALREADY_EXISTS, unknown E_NATIVE); a second request while one is up is SparkError:E_BUSY; Cancel request aborts the pending one with E_ABORTED appCancel"
    platforms: [macos]
    blocking: true
    spec: "#146 AUTH.api"
    covers:
      - ./apple-authentication#signInWithApple
      - ./passkeys#createPasskey
      - ./passkeys#getPasskey
      - ./passkeys#AuthorizationError
  AUTH-SECKEY-01:
    title: "createPasskey and getPasskey with authenticatorAttachment cross-platform use a security key (ASAuthorizationSecurityKeyPublicKeyCredentialProvider) and report its attachment and transports; any offers this Mac's passkeys and a security key in one sheet; getPasskeyAvailability(relyingPartyId, feature) reports each macOS-dependent passkey feature (driver simulation; no sheet, no security key, no relying party)"
    platforms: [macos]
    blocking: true
    spec: "#427 AUTH.securityKeys"
    covers:
      - ./passkeys#createPasskey
      - ./passkeys#getPasskey
      - ./passkeys#getPasskeyAvailability
  AUTH-EXT-01:
    title: "The prf and largeBlob WebAuthn extensions reach AuthenticationServices and their outputs come back (prf enabled and the same output for the same salt, largeBlob supported and written); a feature the macOS lacks reports host-restriction and its option rejects E_UNSUPPORTED_OPTION, never dropped (driver simulation)"
    platforms: [macos]
    blocking: true
    spec: "#427 AUTH.extensions"
    covers:
      - ./passkeys#createPasskey
      - ./passkeys#getPasskey
      - ./passkeys#getPasskeyAvailability
  AUTH-IMMEDIATE-01:
    title: "getPasskey with preferImmediatelyAvailableCredentials (performRequestsWithOptions:) shows nothing and resolves cancel without a passkey on this Mac, and signs in with one (driver simulation)"
    platforms: [macos]
    blocking: true
    spec: "#427 AUTH.immediate"
    covers:
      - ./passkeys#getPasskey
  AUTH-COMBINED-01:
    title: "getCredential offers a passkey and Sign in with Apple in one sheet (one ASAuthorizationController) and reports which the person used (driver simulation; no sheet, no Apple servers)"
    platforms: [macos]
    blocking: true
    spec: "#427 AUTH.combined"
    covers:
      - ./passkeys#getCredential
  AUTH-SIGNAL-01:
    title: "signalUnknownCredential tells the credential manager (ASCredentialDataManager, macOS 26) the relying party no longer knows a passkey, which removes it; without signals on the macOS it rejects E_UNAVAILABLE (driver simulation; no credential manager is reached)"
    platforms: [macos]
    blocking: true
    spec: "#427 AUTH.signals"
    covers:
      - ./passkeys#signalUnknownCredential
  AUTH-REAL-01:
    title: "Real sheets on a team-signed build with macos.authentication: both available; Sign in with Apple shows Apple's sheet over the window and returns the credential, cancelling resolves cancel, Cancel request dismisses the sheet; the credential state is authorized; a passkey is created and used for a domain whose association file lists the app; a security key, prf and largeBlob, an immediate-only request, a passkey-or-Apple sheet and a signal work against the real AuthenticationServices (#427)"
    platforms: [macos]
    blocking: true
    spec: "#146 AUTH.api; #427; provisioning profiles #424"
    covers:
      - ./apple-authentication#signInWithApple
      - ./apple-authentication#getAppleIDCredentialState
      - ./passkeys#createPasskey
      - ./passkeys#getPasskey
      - ./passkeys#getCredential
      - ./passkeys#signalUnknownCredential
  AUTH-UNSUP-01:
    title: "On Windows getAppleAuthenticationAvailability and getPasskeyAvailability report unsupported-platform and requests reject SparkError:E_UNSUPPORTED_PLATFORM (WebAuthn / Windows Hello: #423)"
    platforms: [windows]
    blocking: true
    spec: "#146 AUTH.api; Windows implementation #423"
    covers:
      - ./apple-authentication#getAppleAuthenticationAvailability().available
      - ./passkeys#getPasskeyAvailability().available
      - ./apple-authentication#signInWithApple
      - ./passkeys#createPasskey
  AUTH-VISUAL-01:
    title: "The Sign in with Apple and passkeys screen, with Apple's button in each type and style (the automatic style black in light and white in dark, the title in the app's language), matches its golden in light and dark, English and Arabic"
    platforms: [macos]
    blocking: true
    spec: "#146 AUTH.api; #426 AUTH.button"
    covers:
      - ./apple-authentication#AppleSignInButton
      - ./apple-authentication#getAppleAuthenticationAvailability().available
