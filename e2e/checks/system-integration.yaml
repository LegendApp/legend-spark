area: system-integration
prefix: SYS
checks:
  SYS-DOCKAVAIL-01:
    title: "getSystemAvailability reports the system module, app badge, app progress, attention and the Dock menu available on macOS, and the taskbar menu and thumbnail toolbar unsupported-platform"
    platforms: [macos]
    blocking: true
    spec: "#123 SYS.api-dock"
    covers:
      - ./system
      - ./system#getSystemAvailability
      - ./system#getSystemAvailability().available
  SYS-BADGE-01:
    title: "setAppBadge sets badge text, a count (3, and 1,250 formatted natively) and clears it with an empty string"
    platforms: [macos]
    blocking: true
    spec: "#123 SYS.api-dock"
    covers:
      - ./system#setAppBadge
  SYS-PROGRESS-01:
    title: "setAppProgress accepts normal (35%), indeterminate, paused (60%) and error (80%) progress and null to clear it; a value outside 0-1 rejects SparkError:E_INVALID_ARGUMENT (tests/dock-tile-native.test.ts checks the Dock tile rendering)"
    platforms: [macos]
    blocking: true
    spec: "#123 SYS.api-dock"
    covers:
      - ./system#setAppProgress
  SYS-ATTN-01:
    title: "requestAttention with informational and critical kinds returns a registration whose removal cancels the request"
    platforms: [macos]
    blocking: true
    spec: "#123 SYS.api-dock"
    covers:
      - ./system#requestAttention
  SYS-DOCKMENU-01:
    title: "createDockMenu installs a Dock menu with an action, a checkbox, a separator and a submenu, and its registration removes it"
    platforms: [macos]
    blocking: true
    spec: "#123 SYS.api-dock"
    covers:
      - ./system#createDockMenu
  SYS-TASKBAR-01:
    title: "On Windows the taskbar menu is available and the Dock menu unsupported-platform; badge counts, taskbar progress and a Jump List with tasks and the Recent category succeed"
    platforms: [windows]
    blocking: true
    spec: "#123 SYS.api-dock; Windows verification in #302"
    covers:
      - ./system#getSystemAvailability().available
      - ./system#setAppBadge
      - ./system#setAppProgress
      - ./system#createTaskbarMenu
  SYS-DOCKVISUAL-01:
    title: "The Dock & taskbar screen matches its golden in light and dark, English and Arabic"
    platforms: [macos]
    blocking: true
    spec: "#123 SYS.api-dock"
    covers:
      - ./system#getSystemAvailability().available
  SYS-STATEAVAIL-01:
    title: "getSystemAvailability reports thermal state, network status, memory pressure, Low Power Mode changes and time zone changes available on macOS"
    platforms: [macos]
    blocking: true
    spec: "#124 SYS.api-events"
    covers:
      - ./system
      - ./system#getSystemAvailability
      - ./system#getSystemAvailability().available
  SYS-INFO-01:
    title: "getSystemInfo reports the OS version, process architecture, Rosetta translation, locale, IANA time zone, appearance, idle time, power source, battery, Low Power Mode and thermal state of the Mac it runs on"
    platforms: [macos]
    blocking: true
    spec: "#124 SYS.api-events"
    covers:
      - ./system#getSystemInfo
  SYS-NET-01:
    title: "getNetworkStatus reports the current network path (status, interface types, expensive, Low Data Mode) and system proxies"
    platforms: [macos]
    blocking: true
    spec: "#124 SYS.api-events"
    covers:
      - ./system#getNetworkStatus
  SYS-EVENTS-01:
    title: "onSystemEvent delivers sleep, wake, lock, unlock, user switch (sessionInactive, sessionActive), locale, time zone, clock, proxy, appearance and display changes from the system module's native emitter (injected with simulateSystemEvent; the OS is untouched)"
    platforms: [macos]
    blocking: true
    spec: "#124 SYS.api-events"
    covers:
      - ./system#onSystemEvent
  SYS-EVENTS-02:
    title: "Thermal, Low Power Mode, power source and network events re-read state that reports the injected thermal state, Low Power Mode, battery power and offline path; memoryPressure carries its level"
    platforms: [macos]
    blocking: true
    spec: "#124 SYS.api-events"
    covers:
      - ./system#onSystemEvent
      - ./system#getSystemInfo
      - ./system#getNetworkStatus
  SYS-STATEVISUAL-01:
    title: "The System state screen matches its golden in light and dark, English and Arabic"
    platforms: [macos]
    blocking: true
    spec: "#124 SYS.api-events"
    covers:
      - ./system#getSystemAvailability().available
