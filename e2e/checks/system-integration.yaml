area: system-integration
prefix: SYS
checks:
  SYS-DOCKAVAIL-01:
    title: "getSystemAvailability reports the system module, app badge, app progress, attention and the Dock menu available on macOS, and the taskbar menu and thumbnail toolbar unsupported-platform"
    platforms: [macos]
    blocking: true
    spec: "#123 SYS.api-dock"
    covers:
      - ./system
      - ./system#getSystemAvailability
      - ./system#getSystemAvailability().available
  SYS-BADGE-01:
    title: "setAppBadge sets badge text, a count (3, and 1,250 formatted natively) and clears it with an empty string"
    platforms: [macos]
    blocking: true
    spec: "#123 SYS.api-dock"
    covers:
      - ./system#setAppBadge
  SYS-PROGRESS-01:
    title: "setAppProgress accepts normal (35%), indeterminate, paused (60%) and error (80%) progress and null to clear it; a value outside 0-1 rejects SparkError:E_INVALID_ARGUMENT (tests/dock-tile-native.test.ts checks the Dock tile rendering)"
    platforms: [macos]
    blocking: true
    spec: "#123 SYS.api-dock"
    covers:
      - ./system#setAppProgress
  SYS-ATTN-01:
    title: "requestAttention with informational and critical kinds returns a registration whose removal cancels the request"
    platforms: [macos]
    blocking: true
    spec: "#123 SYS.api-dock"
    covers:
      - ./system#requestAttention
  SYS-DOCKMENU-01:
    title: "createDockMenu installs a Dock menu with an action, a checkbox, a separator and a submenu, and its registration removes it"
    platforms: [macos]
    blocking: true
    spec: "#123 SYS.api-dock"
    covers:
      - ./system#createDockMenu
  SYS-TASKBAR-01:
    title: "On Windows the taskbar menu is available and the Dock menu unsupported-platform; badge counts, taskbar progress and a Jump List with tasks and the Recent category succeed"
    platforms: [windows]
    blocking: true
    spec: "#123 SYS.api-dock; Windows verification in #302"
    covers:
      - ./system#getSystemAvailability().available
      - ./system#setAppBadge
      - ./system#setAppProgress
      - ./system#createTaskbarMenu
  SYS-DOCKVISUAL-01:
    title: "The Dock & taskbar screen matches its golden in light and dark, English and Arabic"
    platforms: [macos]
    blocking: true
    spec: "#123 SYS.api-dock"
    covers:
      - ./system#getSystemAvailability().available
  SYS-STATEAVAIL-01:
    title: "getSystemAvailability reports thermal state, network status, memory pressure, Low Power Mode changes and time zone changes available on macOS"
    platforms: [macos]
    blocking: true
    spec: "#124 SYS.api-events"
    covers:
      - ./system
      - ./system#getSystemAvailability
      - ./system#getSystemAvailability().available
  SYS-INFO-01:
    title: "getSystemInfo reports the OS version, process architecture, Rosetta translation, locale, IANA time zone, appearance, idle time, power source, battery, Low Power Mode and thermal state of the Mac it runs on"
    platforms: [macos]
    blocking: true
    spec: "#124 SYS.api-events"
    covers:
      - ./system#getSystemInfo
  SYS-NET-01:
    title: "getNetworkStatus reports the current network path (status, interface types, expensive, Low Data Mode) and system proxies"
    platforms: [macos]
    blocking: true
    spec: "#124 SYS.api-events"
    covers:
      - ./system#getNetworkStatus
  SYS-EVENTS-01:
    title: "onSystemEvent delivers sleep, wake, lock, unlock, user switch (sessionInactive, sessionActive), locale, time zone, clock, proxy, appearance and display changes from the system module's native emitter (injected with simulateSystemEvent; the OS is untouched)"
    platforms: [macos]
    blocking: true
    spec: "#124 SYS.api-events"
    covers:
      - ./system#onSystemEvent
  SYS-EVENTS-02:
    title: "Thermal, Low Power Mode, power source and network events re-read state that reports the injected thermal state, Low Power Mode, battery power and offline path; memoryPressure carries its level"
    platforms: [macos]
    blocking: true
    spec: "#124 SYS.api-events"
    covers:
      - ./system#onSystemEvent
      - ./system#getSystemInfo
      - ./system#getNetworkStatus
  SYS-STATEVISUAL-01:
    title: "The System state screen matches its golden in light and dark, English and Arabic"
    platforms: [macos]
    blocking: true
    spec: "#124 SYS.api-events"
    covers:
      - ./system#getSystemAvailability().available
  SYS-PERMAVAIL-01:
    title: "getPermissionAvailability reports the permissions module available on macOS, and every kind's state reads without a prompt"
    platforms: [macos]
    blocking: true
    spec: "#126 SYS.api-perms"
    covers:
      - ./permissions
      - ./permissions#getPermissionAvailability
      - ./permissions#getPermissionAvailability().available
      - ./permissions#getPermissionStatus
  SYS-PERMREQ-01:
    title: "requestPermission shows one prompt while macOS could (undetermined, write-only calendar), resolves the answer as status and native authorization, resolves a decided state without a prompt, and rejects SparkError:E_UNAVAILABLE without an answer (driver simulation; TCC is untouched)"
    platforms: [macos]
    blocking: true
    spec: "#126 SYS.api-perms"
    covers:
      - ./permissions#requestPermission
      - ./permissions#getPermissionStatus
  SYS-PERMEVENTS-01:
    title: "addPermissionListener reports each changed kind with its previous and new state, after a request and after a change made outside the app; an unknown native state reads as unknown"
    platforms: [macos]
    blocking: true
    spec: "#126 SYS.api-perms"
    covers:
      - ./permissions#addPermissionListener
  SYS-PERMSETTINGS-01:
    title: "openPermissionSettings resolves for a kind's Privacy & Security pane (in driver mode recorded, never opened; tests/permissions.native.mm checks the x-apple.systempreferences links)"
    platforms: [macos]
    blocking: true
    spec: "#126 SYS.api-perms"
    covers:
      - ./permissions#openPermissionSettings
  SYS-PERMREAL-01:
    title: "Real TCC prompts: requesting camera, microphone, contacts, calendar, photos, location and Finder automation shows each system prompt once and reports the answer; screen recording, accessibility and input monitoring send the person to System Settings, and the change arrives when the app becomes active; Settings opens each pane"
    platforms: [macos]
    blocking: true
    spec: "#126 SYS.api-perms"
    covers:
      - ./permissions#requestPermission
      - ./permissions#addPermissionListener
      - ./permissions#openPermissionSettings
  SYS-PERMUNSUP-01:
    title: "On Windows getPermissionAvailability reports unsupported-platform and status reads and the listener reject SparkError:E_UNSUPPORTED_PLATFORM (#378)"
    platforms: [windows]
    blocking: true
    spec: "#126 SYS.api-perms; Windows implementation #378"
    covers:
      - ./permissions#getPermissionAvailability().available
      - ./permissions#getPermissionStatus
      - ./permissions#addPermissionListener
  SYS-PERMVISUAL-01:
    title: "The Privacy permissions screen matches its golden in light and dark, English and Arabic"
    platforms: [macos]
    blocking: true
    spec: "#126 SYS.api-perms"
    covers:
      - ./permissions#getPermissionAvailability().available
  SYS-SHAREAVAIL-01:
    title: "getSharingAvailability reports share, services and spotlight available on macOS, and getDefaultURLHandlerAvailability reports the default URL handler available"
    platforms: [macos]
    blocking: true
    spec: "#125 SYS.api-services"
    covers:
      - ./sharing
      - ./sharing#getSharingAvailability
      - ./sharing#getSharingAvailability(share).available
      - ./sharing#getSharingAvailability(services).available
      - ./sharing#getSharingAvailability(spotlight).available
      - ./links#getDefaultURLHandlerAvailability
      - ./links#getDefaultURLHandlerAvailability().available
  SYS-SHARE-01:
    title: "share sends text, a web link and an existing file to the picker from an anchor view and resolves the chosen service or dismissed; with no answer it rejects SparkError:E_UNAVAILABLE (driver simulation; no picker appears)"
    platforms: [macos]
    blocking: true
    spec: "#125 SYS.api-services"
    covers:
      - ./sharing#share
  SYS-SERVICES-01:
    title: "addServiceListener rejects SparkError:E_UNAVAILABLE for an undeclared service, registers a declared one, and receives the text a Services menu invocation sends (driver simulation; pbs and the Services menu are untouched)"
    platforms: [macos]
    blocking: true
    spec: "#125 SYS.api-services"
    covers:
      - ./sharing#addServiceListener
  SYS-SPOTLIGHT-01:
    title: "indexSpotlightItems adds three items to the app's index and deleteSpotlightItems removes them by domain; an opened Spotlight item reaches addSpotlightListener with its id (driver simulation; the real index is untouched)"
    platforms: [macos]
    blocking: true
    spec: "#125 SYS.api-services"
    covers:
      - ./sharing#indexSpotlightItems
      - ./sharing#deleteSpotlightItems
      - ./sharing#addSpotlightListener
  SYS-DEFHANDLER-01:
    title: "isDefaultURLHandler reports spark-ks not default, setDefaultURLHandler makes the app its default, and a universal link arrives as an https url event (driver simulation; LaunchServices is untouched)"
    platforms: [macos]
    blocking: true
    spec: "#125 SYS.api-services"
    covers:
      - ./links#isDefaultURLHandler
      - ./links#setDefaultURLHandler
  SYS-SHAREREAL-01:
    title: "Real system paths: the share picker shows the services for text, a link and a file and reports the chosen one or a dismissal; Spotlight finds the indexed recipes and opening one reaches the app; Make default makes the Kitchen Sink the spark-ks handler"
    platforms: [macos]
    blocking: true
    spec: "#125 SYS.api-services"
    covers:
      - ./sharing#share
      - ./sharing#indexSpotlightItems
      - ./sharing#deleteSpotlightItems
      - ./sharing#addSpotlightListener
      - ./links#setDefaultURLHandler
      - ./links#isDefaultURLHandler
  SYS-SHAREUNSUP-01:
    title: "On Windows getSharingAvailability and getDefaultURLHandlerAvailability report unsupported-platform and the sharing calls reject SparkError:E_UNSUPPORTED_PLATFORM (#392)"
    platforms: [windows]
    blocking: true
    spec: "#125 SYS.api-services; Windows implementation #392"
    covers:
      - ./sharing#getSharingAvailability(share).available
      - ./sharing#share
      - ./sharing#addServiceListener
      - ./links#getDefaultURLHandlerAvailability().available
  SYS-SHAREVISUAL-01:
    title: "The Sharing & Spotlight screen matches its golden in light and dark, English and Arabic"
    platforms: [macos]
    blocking: true
    spec: "#125 SYS.api-services"
    covers:
      - ./sharing#getSharingAvailability(share).available
  SYS-INTENTSAVAIL-01:
    title: "getAppIntentsAvailability reports App Intents available (the driver simulates the build's compiled intents), and getAppIntents lists only the intents the app declares: none until the simulation declares the Kitchen Sink's two"
    platforms: [macos]
    blocking: true
    spec: "#393 SYS.api-app-intents"
    covers:
      - ./app-intents
      - ./app-intents#getAppIntentsAvailability
      - ./app-intents#getAppIntentsAvailability().available
      - ./app-intents#getAppIntents
  SYS-INTENTS-01:
    title: "addAppIntentHandler rejects SparkError:E_NOT_FOUND for an undeclared intent, registers declared ones, answers an invocation with its text, passes an enum parameter's case value and fills a missing parameter's default, fails one with the handler's SparkError code, refuses parameters that do not match the declaration (an enum value that is not a case) before the handler runs, and completes an intent that returns nothing (driver simulation; nothing reaches the system)"
    platforms: [macos]
    blocking: true
    spec: "#393 SYS.api-app-intents"
    covers:
      - ./app-intents#addAppIntentHandler
  SYS-INTENTSHELD-01:
    title: "An invocation or entity query that arrives before its handler (as when an intent launches the app) waits and reaches the handler once it registers; one nobody handles ends SparkError:E_TIMEOUT (driver simulation)"
    platforms: [macos]
    blocking: true
    spec: "#393 SYS.api-app-intents"
    covers:
      - ./app-intents#addAppIntentHandler
      - ./app-intents#addAppEntityQueryHandler
  SYS-INTENTSENTITY-01:
    title: "addAppEntityQueryHandler answers the entity's suggested, search and identifier queries with the handler's entities (a query for an undeclared entity ends SparkError:E_NOT_FOUND), and an intent with an entity parameter gets the picked entity's id and fails with the handler's error for an unknown one (driver simulation; nothing reaches the system)"
    platforms: [macos]
    blocking: true
    spec: "#416 SYS.api-app-intents-types"
    covers:
      - ./app-intents#addAppEntityQueryHandler
      - ./app-intents#addAppIntentHandler
  SYS-INTENTSDONATE-01:
    title: "donateAppIntent rejects SparkError:E_NOT_FOUND for an undeclared intent and donates a declared one with its parameters (driver simulation; nothing is donated to the system)"
    platforms: [macos]
    blocking: true
    spec: "#393 SYS.api-app-intents"
    covers:
      - ./app-intents#donateAppIntent
  SYS-INTENTSREAL-01:
    title: "Real system paths in a build that declares the Kitchen Sink's intents: Shortcuts lists them, offers the recipe enum's cases in a picker and the summary with its default, runs Show Recipe with its parameters and shows the text the handler returned, shows the handler's error for Start Timer, lists, searches and opens notes through the entity query, launches the quit app to run one, offers the App Shortcut with a phrase per recipe in Spotlight, shows every title in Arabic and French, and a donation succeeds"
    platforms: [macos]
    blocking: true
    spec: "#393 SYS.api-app-intents"
    covers:
      - ./app-intents#getAppIntentsAvailability().available
      - ./app-intents#getAppIntents
      - ./app-intents#addAppIntentHandler
      - ./app-intents#donateAppIntent
      - ./app-intents#addAppEntityQueryHandler
  SYS-INTENTSUNSUP-01:
    title: "On Windows getAppIntentsAvailability reports unsupported-platform and the App Intents calls, including addAppEntityQueryHandler, reject SparkError:E_UNSUPPORTED_PLATFORM"
    platforms: [windows]
    blocking: true
    spec: "#393 SYS.api-app-intents"
    covers:
      - ./app-intents#getAppIntentsAvailability().available
      - ./app-intents#getAppIntents
      - ./app-intents#addAppIntentHandler
      - ./app-intents#donateAppIntent
      - ./app-intents#addAppEntityQueryHandler
  SYS-INTENTSVISUAL-01:
    title: "The App Intents & Shortcuts screen matches its golden in light and dark, English and Arabic"
    platforms: [macos]
    blocking: true
    spec: "#393 SYS.api-app-intents"
    covers:
      - ./app-intents#getAppIntentsAvailability().available
