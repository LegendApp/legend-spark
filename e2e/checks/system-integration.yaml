area: system-integration
prefix: SYS
checks:
  SYS-DOCKAVAIL-01:
    title: "getSystemAvailability reports the system module, app badge, app progress, attention and the Dock menu available on macOS, and the taskbar menu unsupported-platform"
    platforms: [macos]
    blocking: true
    spec: "#123 SYS.api-dock"
    covers:
      - ./system
      - ./system#getSystemAvailability
      - ./system#getSystemAvailability().available
  SYS-BADGE-01:
    title: "setAppBadge sets badge text, a count (3, and 1,250 formatted natively) and clears it with an empty string"
    platforms: [macos]
    blocking: true
    spec: "#123 SYS.api-dock"
    covers:
      - ./system#setAppBadge
  SYS-PROGRESS-01:
    title: "setAppProgress accepts normal (35%), indeterminate, paused (60%) and error (80%) progress and null to clear it; a value outside 0-1 rejects SparkError:E_INVALID_ARGUMENT (tests/dock-tile-native.test.ts checks the Dock tile rendering)"
    platforms: [macos]
    blocking: true
    spec: "#123 SYS.api-dock"
    covers:
      - ./system#setAppProgress
  SYS-ATTN-01:
    title: "requestAttention with informational and critical kinds returns a registration whose removal cancels the request"
    platforms: [macos]
    blocking: true
    spec: "#123 SYS.api-dock"
    covers:
      - ./system#requestAttention
  SYS-DOCKMENU-01:
    title: "createDockMenu installs a Dock menu with an action, a checkbox, a separator and a submenu, and its registration removes it"
    platforms: [macos]
    blocking: true
    spec: "#123 SYS.api-dock"
    covers:
      - ./system#createDockMenu
  SYS-TASKBAR-01:
    title: "On Windows the taskbar menu is available and the Dock menu and app progress unsupported-platform; badge text and a Jump List with tasks succeed, and badge counts and progress reject SparkError:E_UNSUPPORTED_PLATFORM"
    platforms: [windows]
    blocking: true
    spec: "#123 SYS.api-dock; Windows verification in #302"
    covers:
      - ./system#getSystemAvailability().available
      - ./system#setAppBadge
      - ./system#setAppProgress
      - ./system#createTaskbarMenu
  SYS-DOCKVISUAL-01:
    title: "The Dock & taskbar screen matches its golden in light and dark, English and Arabic"
    platforms: [macos]
    blocking: true
    spec: "#123 SYS.api-dock"
    covers:
      - ./system#getSystemAvailability().available
  SYS-KEEPAWAKE-01:
    title: expo-keep-awake holds a display-sleep power assertion on macOS while activated and releases it on deactivate
    platforms: [macos]
    blocking: false
    spec: "vault tasks/spark/desktop-libs/expo-keep-awake.md"
  SYS-EXPOAPP-01:
    title: expo-application reports the bundle identifier, version and an installation time from the app bundle on macOS, and Mac answers (no vendor ID, unknown release type) for iOS-only queries
    platforms: [macos]
    blocking: false
    spec: "vault tasks/spark/desktop-libs/expo-application.md"
  SYS-EXPODEVICE-01:
    title: expo-device reports the Mac's model identifier, macOS version and build, memory, CPU architecture, desktop device type, name and uptime
    platforms: [macos]
    blocking: false
    spec: "vault tasks/spark/desktop-libs/expo-device.md"
  SYS-EXPOHAPTICS-01:
    title: expo-haptics notification, impact and selection calls resolve on macOS through NSHapticFeedbackManager instead of rejecting as unavailable
    platforms: [macos]
    blocking: false
    spec: "vault tasks/spark/desktop-libs/expo-haptics.md"
  SYS-EXPOLOCATION-01:
    title: expo-location reports permission, Location Services and provider status from CoreLocation on macOS, and no compass heading
    platforms: [macos]
    blocking: false
    spec: "vault tasks/spark/desktop-libs/expo-location.md"
