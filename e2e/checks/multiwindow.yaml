area: multiwindow
prefix: MW
checks:
  MW-TYPE-01:
    title: A navigator entry without an id opens a new window with its own generated ID on every open
    platforms: [macos, windows]
    blocking: true
    spec: "docs/api-window-contract.md §Navigator"
    covers:
      - ./windows#createWindowsNavigator
      - ./windows#useWindowInstance
  MW-SINGLE-01:
    title: A singleton entry (with id) opens one window; opening it again focuses that window instead of opening another
    platforms: [macos, windows]
    blocking: true
    spec: "docs/api-window-contract.md §Navigator"
    covers:
      - ./windows#createWindowsNavigator
  MW-STATE-01:
    title: An app-scoped document is live across two windows and the main window; an edit in one renders in the others
    platforms: [macos, windows]
    blocking: true
    spec: "docs/api-window-contract.md §Shared and scoped state"
    covers:
      - ./windows#createWindowsNavigator
  MW-STATE-02:
    title: Window-scoped state stays private to its window until promoted; an attached window then shares the promoted value
    platforms: [macos, windows]
    blocking: true
    spec: "docs/api-window-contract.md §Shared and scoped state"
    covers:
      - ./windows#createWindowState
      - ./windows#useWindowState
  MW-UNDO-01:
    title: Each window has its own undo history, and Edit > Undo follows the key window
    platforms: [macos, windows]
    blocking: true
    spec: "docs/api-window-contract.md §Undo, keyboard, menus and toolbar per window"
    covers:
      - ./windows#useUndoState
      - ./windows#createWindowsNavigator
  MW-MENU-01:
    title: The menu bar shows the key navigator window's menu, routes its actions to that window, and withdraws it when the main window is key
    platforms: [macos, windows]
    blocking: true
    spec: "docs/api-window-contract.md §Undo, keyboard, menus and toolbar per window"
    covers:
      - ./windows#createWindowsNavigator
  MW-ERROR-01:
    title: A render error replaces only that window's content with the default fallback; other windows keep working and Try again recovers
    platforms: [macos, windows]
    blocking: true
    spec: "docs/api-window-contract.md §Error isolation"
    covers:
      - ./windows#DefaultErrorFallback
  MW-RUNTIME-01:
    title: getIsolatedRuntimeAvailability reports available in the Kitchen Sink, and an isolated entry renders in its named runtime, not the main runtime
    platforms: [macos, windows]
    blocking: true
    spec: "docs/api-window-contract.md §Runtime model"
    covers:
      - ./windows#getIsolatedRuntimeAvailability().available
  MW-VISUAL-01:
    title: The Multiwindow screen matches its approved golden in light and dark, English and Arabic
    platforms: [macos]
    blocking: true
    spec: "docs/e2e-flows.md Visual goldens; #227"
  MW-MSG-01:
    title: A typed request from the main window reaches one note window's handler and resolves with that window's summary
    platforms: [macos, windows]
    blocking: true
    spec: "docs/api-window-contract.md §Messages between windows"
    covers:
      - ./windows#createWindowMessages
  MW-MSG-02:
    title: A broadcast reaches every listening window and the main window except its sender, and reports how many listeners it reached
    platforms: [macos, windows]
    blocking: true
    spec: "docs/api-window-contract.md §Messages between windows"
    covers:
      - ./windows#createWindowMessages
  MW-RESTORE-01:
    title: A saved window session restores each note window's frame, route, scroll offset, selected item and sidebar width after its windows close
    platforms: [macos, windows]
    blocking: true
    spec: "docs/api-window-contract.md §Window sessions"
    covers:
      - ./windows#createWindowsNavigator
      - ./windows#createWindowState
  MW-RESTORE-02:
    title: A session saved to Spark settings restores the same windows and per-window state after the app quits and relaunches
    platforms: [macos, windows]
    blocking: true
    spec: "docs/api-window-contract.md §Window sessions"
    covers:
      - ./windows#createWindowsNavigator
  MW-RESTORE-03:
    title: getWindowSessionAvailability('tabs') reports available, and a restored session rejoins its tab groups in tab order with the saved tab selected
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Window sessions"
    covers:
      - ./windows#getWindowSessionAvailability().available
  MW-RESTORE-04:
    title: On Windows, getWindowSessionAvailability('tabs') reports unsupported-platform and New Window as a tab rejects E_UNSUPPORTED_OPTION
    platforms: [windows]
    blocking: true
    spec: "docs/api-window-contract.md §Window sessions"
    covers:
      - ./windows#getWindowSessionAvailability
  MW-DUP-01:
    title: New Window opens a cascaded copy of a note with its route, scroll offset, selection and sidebar width; the copy's view is its own, and app-scoped values stay shared
    platforms: [macos, windows]
    blocking: true
    spec: "docs/api-window-contract.md §Window sessions"
    covers:
      - ./windows#createWindowsNavigator
      - ./windows#createWindowState
  MW-DUP-02:
    title: A detached New Window shares nothing with its source (it copies the restorable view and starts other window state fresh instead of attaching to the source's app-scoped stars); New Window as a tab joins the source's tab group as its selected tab
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Window sessions"
    covers:
      - ./windows#createWindowsNavigator
  MW-SPECIAL-01:
    title: getSpecialWindowAvailability reports every special window type available on macOS
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Special window types"
    covers:
      - ./windows#getSpecialWindowAvailability
      - ./windows#getSpecialWindowAvailability().available
  MW-SPECIAL-02:
    title: A command bar opens hidden; its global hotkey shows it centered on the display with its top a fifth of the way down the work area, and pressing it again hides it; removing it unregisters the hotkey
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Special window types"
    covers:
      - ./windows#createCommandBar
  MW-SPECIAL-03:
    title: A HUD shows centered two thirds of the way down the display and hides itself after its duration; a duration of 0 keeps it until hide()
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Special window types"
    covers:
      - ./windows#createHUD
  MW-SPECIAL-04:
    title: A preview window grows from its thumbnail to the center of the display and shrinks back into the thumbnail before it closes
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Special window types"
    covers:
      - ./windows#openPreviewWindow
  MW-SPECIAL-05:
    title: A picture-in-picture window opens in the bottom-right corner, snapTo moves it to another corner, and any other move snaps to the nearest corner
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Special window types"
    covers:
      - ./windows#openPictureInPicture
  MW-SPECIAL-06:
    title: A notch popover hangs centered below the menu bar of the notched display, and a menu bar item popover hangs below the item, kept inside the display
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Special window types"
    covers:
      - ./windows#openPopover
  MW-SPECIAL-07:
    title: An edge drawer waits hidden past the display's right edge, slides in flush with it when opened, and slides out and hides when closed
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Special window types"
    covers:
      - ./windows#createEdgeDrawer
  MW-SPECIAL-08:
    title: A click-through overlay and a desktop widget open shown at the requested rectangle and position, and close with closeWindow
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Special window types"
    covers:
      - ./windows#openOverlay
      - ./windows#openDesktopWidget
  MW-SPECIAL-09:
    title: Presenter mode fills the second display with the audience window and centers the controller on the primary one; swapping exchanges them, disconnecting a display ends it and closes both, and with one display it rejects E_UNAVAILABLE
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Special window types"
    covers:
      - ./windows#startPresenterMode
  MW-SPECIAL-10:
    title: On screen, the command bar and popovers take key focus without activating the app and close or hide when another window takes it; panels show over fullscreen apps and on every Space; the overlay lets clicks through; the desktop widget sits below every app window; a dragged picture-in-picture window snaps to a corner on release
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Special window types"
    covers:
      - ./windows#createCommandBar
      - ./windows#openPopover
      - ./windows#openOverlay
      - ./windows#openDesktopWidget
      - ./windows#openPictureInPicture
  MW-SPECIAL-11:
    title: On Windows, getSpecialWindowAvailability reports unsupported-platform for every type and every special window factory rejects E_UNSUPPORTED_PLATFORM
    platforms: [windows]
    blocking: true
    spec: "docs/api-window-contract.md §Special window types"
    covers:
      - ./windows#getSpecialWindowAvailability
  MW-PERF-01:
    title: getWindowPerformanceAvailability reports window pools and background render throttling available on macOS
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Window pools"
    covers:
      - ./windows#getWindowPerformanceAvailability
      - ./windows#getWindowPerformanceAvailability(pool).available
      - ./windows#getWindowPerformanceAvailability(throttle).available
  MW-PERF-02:
    title: prewarm creates a hidden warm window whose root renders nothing; opening the pooled entry takes it, renders the open's props and shows it in under 100 ms from the open call to the content's first commit, and the pool refills
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Window pools"
    covers:
      - ./windows#createWindowsNavigator
  MW-PERF-03:
    title: A closed pooled window parks and is reused with fresh content; past max it closes for real; trimPool closes warm windows for real; repeated open, park, trim and prewarm cycles leave no windows, views or listeners behind
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Window pools"
    covers:
      - ./windows#createWindowsNavigator
  MW-PERF-04:
    title: A pool keeps no more warm windows than fit its memory budget at the median measured cost per window (a 1 MB budget keeps none); memory pressure closes every warm window and stops refilling, and its return to normal refills
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Window pools"
    covers:
      - ./windows#createWindowsNavigator
  MW-PERF-05:
    title: A throttled window renders none of five shared-state changes while it is hidden, keeps its content state, and renders the latest value once it is shown again
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Background render throttling"
    covers:
      - ./windows#createWindowsNavigator
  MW-PERF-06:
    title: On screen, a warm window shows its content in its first frame (no blank window), and a throttled window fully covered by another window stops rendering and catches up when uncovered, with at most one frame of empty background
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Window pools; §Background render throttling"
    covers:
      - ./windows#createWindowsNavigator
  MW-PERF-07:
    title: "On Windows, getWindowPerformanceAvailability reports unsupported-platform for pools and throttling, and a navigator with a pool rejects E_UNSUPPORTED_OPTION (implementation: #414)"
    platforms: [windows]
    blocking: true
    spec: "docs/api-window-contract.md §Window pools"
    covers:
      - ./windows#getWindowPerformanceAvailability
  MW-CHOREO-01:
    title: getWindowChoreographyAvailability reports zooms, animated frames, close transitions and attached windows available on macOS
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Window choreography"
    covers:
      - ./windows#getWindowChoreographyAvailability
      - ./windows#getWindowChoreographyAvailability(zoom).available
      - ./windows#getWindowChoreographyAvailability(frame).available
      - ./windows#getWindowChoreographyAvailability(closeTransition).available
      - ./windows#getWindowChoreographyAvailability(attach).available
  MW-CHOREO-02:
    title: On the virtual clock, a window opened from a thumbnail shows at the thumbnail, is halfway to its frame at half its duration and at its frame at the end; closing it shrinks it back into the thumbnail before it closes
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Window choreography"
    covers:
      - ./windows#openWindowFrom
  MW-CHOREO-03:
    title: A window opened from a list row in the main window grows out of the row to its frame, and closing it returns it into the row
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Window choreography"
    covers:
      - ./windows#openWindowFrom
  MW-CHOREO-04:
    title: Compact↔full and Settings pane resizes animate the frame (halfway at half the duration on the virtual clock); a second animation interrupts the first, which reports interrupted, and stopping leaves the window where it is
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Window choreography"
    covers:
      - ./windows#animateWindowBounds
      - ./windows#stopWindowAnimation
  MW-CHOREO-05:
    title: Another animation during a close transition's shrink cancels the close (interrupted) and the window stays open; the next close shrinks and closes
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Window choreography"
    covers:
      - ./windows#openWindowFrom
      - ./windows#animateWindowBounds
  MW-CHOREO-06:
    title: With Reduce Motion on, a zoom is a fade at the window's frame and a resize is immediate, and both report Reduce Motion
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Window choreography"
    covers:
      - ./windows#openWindowFrom
      - ./windows#animateWindowBounds
  MW-CHOREO-07:
    title: Tearing the notes panel off opens a window out of its slot and leaves a placeholder; merging shrinks the window back into the slot, closes it and the panel returns
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Window choreography"
    covers:
      - ./windows#openWindowFrom
      - ./windows#setWindowCloseTransition
  MW-CHOREO-08:
    title: An inspector attaches at the main window's trailing edge, docked, and shows the item selected in the main window's list as the selection changes
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Window choreography"
    covers:
      - ./windows#attachWindow
  MW-CHOREO-09:
    title: A palette attaches at the main window's leading edge; a move 12 points off its docked frame snaps it back, a move 200 points off undocks it, and a move back within the magnetic distance docks it again
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Window choreography"
    covers:
      - ./windows#attachWindow
  MW-CHOREO-10:
    title: On screen, zooms and shrinks look continuous at the display's frame rate, closing hands key focus to the main window, a dragged palette docks magnetically and moves with the main window, it hides while the app is inactive, and the system Reduce Motion setting turns zooms into fades
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Window choreography"
    covers:
      - ./windows#openWindowFrom
      - ./windows#attachWindow
  MW-CHOREO-11:
    title: "On Windows, getWindowChoreographyAvailability reports unsupported-platform for every feature and the operations reject E_UNSUPPORTED_PLATFORM (implementation: #434)"
    platforms: [windows]
    blocking: true
    spec: "docs/api-window-contract.md §Window choreography"
    covers:
      - ./windows#getWindowChoreographyAvailability
  MW-WORKSPACE-01:
    title: getWindowWorkspaceAvailability reports workspaces available on macOS; saving names a workspace of the open windows and connected displays, restoring closes the windows and reopens the saved ones at their exact frames, and workspaces rename and delete
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Workspaces"
    covers:
      - ./windows#getWindowWorkspaceAvailability
      - ./windows#getWindowWorkspaceAvailability().available
      - ./windows#createWindowWorkspaces
  MW-WORKSPACE-02:
    title: Saved workspaces are stored in the app's data directory and survive quitting and relaunching
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Workspaces"
    covers:
      - ./windows#createWindowWorkspaces
  MW-WORKSPACE-03:
    title: Restoring adapts the layout to the connected displays; a window of a disconnected display keeps its place and proportions on the remaining display (scaled), and another display of the same size takes it at the same place (moved)
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Workspaces"
    covers:
      - ./windows#createWindowWorkspaces
  MW-WORKSPACE-04:
    title: The Workspaces menu has Save Workspace… (⌥⌘S), which saves under the app's name, and an item per workspace with ⌃⌘1–9; the shortcut restores the workspace
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Workspaces"
    covers:
      - ./windows#createWindowWorkspaces
  MW-WORKSPACE-05:
    title: A damaged workspaces file is reported as E_INVALID_DATA on load and on save, is not overwritten, and clearing it recovers
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Workspaces"
    covers:
      - ./windows#createWindowWorkspaces
  MW-WORKSPACE-06:
    title: On screen, a workspace restores on the active Space, with Stage Manager on its windows arrive as new windows do, a fullscreen window returns to fullscreen in its own Space, and unplugging a real display adapts the layout
    platforms: [macos]
    blocking: true
    spec: "docs/api-window-contract.md §Workspaces"
    covers:
      - ./windows#createWindowWorkspaces
  MW-WORKSPACE-07:
    title: "On Windows, getWindowWorkspaceAvailability reports unsupported-platform and createWindowWorkspaces rejects E_UNSUPPORTED_PLATFORM (implementation: #445)"
    platforms: [windows]
    blocking: true
    spec: "docs/api-window-contract.md §Workspaces"
    covers:
      - ./windows#getWindowWorkspaceAvailability
