appId: so.legend.spark.examples.kitchensink
name: React DevTools in a development session
intent: >
  The Components and Profiler panels need a development build with JavaScript from spark dev's inspector proxy, which
  neither the release gate nor the driver's own bundle server provides. bun scripts/test-react-devtools.ts drives them
  headlessly: it starts spark dev, launches the dev build in driver mode and speaks the React DevTools bridge over CDP
  as React Native DevTools does. It lists the roots and reads ReactDevToolsSample's props, state and hooks, edits a prop
  and a hook's state, records highlight updates (and finds their outlines in a capture of the window) and a profile,
  and selects elements by clicking in the main window, a note window and an isolated-runtime window. The panels
  themselves need a person.
checks: [DEVT-REACT-01, DEVT-REACT-02, DEVT-REACT-03, DEVT-REACT-04, DEVT-REACT-05, DEVT-REACT-06]
tags: [devtools]
platforms: [macos]
build: dev
manual: true
---
- manualStep:
    instruction: After cd examples/kitchen-sink && bun run rebuild:macos, run bun scripts/test-react-devtools.ts from the repository root.
    expect: It prints PASS for components, props/state/hooks, editing, highlight updates, profiler, select element, multiple windows and isolated runtime, and exits 0.
    evidence: none
    signoff: required
- manualStep:
    instruction: Run bun run macos in examples/kitchen-sink, open DevTools › React DevTools, press Open a note window, then ⌥⌘I and choose Components. Select ReactDevToolsSample and edit its label and count; turn on Highlight updates in the Components settings and press Increment; record in Profiler while pressing Increment; press Select element and click a view in the note window, then click in the main window.
    expect: The tree lists the main window's and the note window's roots; edits show in the app at once; Increment outlines the changed views; the Profiler shows a commit per press with its duration and that hook 1 changed; the click in the note window selects the component under it, and the next click in the main window reaches the app.
    evidence: none
    signoff: required
- manualStep:
    instruction: 'Press Open an isolated-runtime window, then open DevTools for "KitchenSink (isolated runtime: ks-plugins)" (press j in the spark dev terminal) and choose Components.'
    expect: 'The tree has one root, ThreadedRuntimeHost, with IsolatedPanelContent and its label "React DevTools"; Select element selects views in the isolated window.'
    evidence: none
    signoff: required
