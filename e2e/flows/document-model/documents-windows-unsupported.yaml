appId: so.legend.spark.examples.kitchensink
name: Document sessions and versions are typed unsupported on Windows
intent: >
  On Windows, Document model > Documents shows both availabilities as unsupported-platform and the
  E_UNSUPPORTED_PLATFORM that createDocumentSession throws; no session or operation buttons appear.
  Windows implementation: #280.
checks: [DOC-DOCUNSUP-01]
tags: [document-model]
platforms: [windows]
---
- launchApp: { openUrl: "spark-ks://document-model/documents" }
- extendedWaitUntil: { visible: { id: document-model-documents-availability-session-unsupported-platform }, timeout: 15s }
- assertVisible: { id: document-model-documents-availability-versions-unsupported-platform }
- assertVisible: { id: document-model-documents-unsupported-e-unsupported-platform }
- assertNotVisible: { id: document-model-documents-name }
