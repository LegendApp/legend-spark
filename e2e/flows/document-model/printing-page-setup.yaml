appId: so.legend.spark.examples.kitchensink
name: Page setup sheet, persisted across launches
intent: >
  After clearState the Printing screen uses the app's default page setup (A4 portrait, 54-point
  margins). "Page setup…" opens the page setup sheet on the main window; Cancel keeps the setup and
  resolves {"canceled":true}. Choosing Landscape and OK resolves the typed setup (margins pass
  through: the macOS sheet has none), which the screen shows and keeps in the app's settings, so a
  relaunch without clearState still shows it. "Use system default" replaces it with
  getDefaultPageSetup, whose paper depends on the default printer.
checks: [DOC-SETUP-01]
tags: [document-model]
platforms: [macos]
---
- launchApp: { clearState: true, openUrl: "spark-ks://document-model/printing" }
- extendedWaitUntil: { visible: { id: document-model-printing-root }, timeout: 10s }
- assertText: { id: document-model-printing-current-setup, equals: "A4 · Portrait · margins 54/54/54/54 pt" }
- tapOn: { id: document-model-printing-page-setup }
- assertDialog: { kind: sheet, buttons: [Cancel, OK], default: OK, attachedTo: main }
- tapOn: { text: Cancel, window: key }
- assertText: { id: document-model-printing-page-setup-result, equals: '{"canceled":true}' }
- tapOn: { id: document-model-printing-page-setup }
- tapOn: { role: radioButton, label: Landscape, window: key }
- tapOn: { text: OK, window: key }
- assertText: { id: document-model-printing-page-setup-result, equals: '{"canceled":false,"pageSetup":{"paperSize":{"width":595.28,"height":841.89},"orientation":"landscape","margins":{"top":54,"right":54,"bottom":54,"left":54}}}' }
- assertText: { id: document-model-printing-current-setup, equals: "A4 · Landscape · margins 54/54/54/54 pt" }
- launchApp: { openUrl: "spark-ks://document-model/printing" }
- assertText: { id: document-model-printing-current-setup, equals: "A4 · Landscape · margins 54/54/54/54 pt" }
- tapOn: { id: document-model-printing-system-default }
- assertVisible: { id: document-model-printing-system-default-result, text: '/^\{"paperSize":\{"width":\d+(\.\d+)?,"height":\d+(\.\d+)?\},"orientation":"(portrait|landscape)","margins":\{.*\}\}$/' }
