appId: so.legend.spark.examples.kitchensink
name: The App Sandbox variant ships without Sparkle and launch daemons
intent: >
  The App Sandbox variant on disk has no Sparkle code, no SU* (Sparkle) keys in its Info.plist and no
  Contents/Library/LaunchDaemons: the App Store updates a Mac App Store app, and a sandboxed app cannot install a
  privileged helper. spark build --sandbox leaves out @legendapp/spark-updates and the helper plists.
checks: [DIST-MAS-02]
tags: [packaging-distribution]
platforms: [macos]
variant: sandbox
---
- assertSandboxVariant: "${APP_PATH}"
