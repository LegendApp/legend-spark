appId: so.legend.spark.examples.kitchensink
name: Drag and drop extensions are typed unsupported on Windows
intent: >
  On Windows the Drag & drop features screen reports drag and drop available and promised files, spring loading,
  custom drag images and operation masks unsupported-platform. A drag view requesting each of them throws
  SparkError:E_UNSUPPORTED_PLATFORM, which the screen shows. Implementation: #365.
checks: [DND-UNSUP-01]
tags: [drag-drop]
platforms: [windows]
---
- launchApp: { clearState: true, openUrl: "spark-ks://drag-drop/features" }
- extendedWaitUntil: { visible: { id: drag-drop-features-root }, timeout: 10s }
- assertText: { id: drag-drop-features-availability-module, equals: 'module: {"available":true}' }
- assertText: { id: drag-drop-features-availability-promised-files, equals: 'promised-files: {"available":false,"reason":"unsupported-platform"}' }
- assertText: { id: drag-drop-features-availability-spring-loading, equals: 'spring-loading: {"available":false,"reason":"unsupported-platform"}' }
- assertText: { id: drag-drop-features-availability-drag-image, equals: 'drag-image: {"available":false,"reason":"unsupported-platform"}' }
- assertText: { id: drag-drop-features-availability-operation-masks, equals: 'operation-masks: {"available":false,"reason":"unsupported-platform"}' }
- assertText: { id: drag-drop-features-probe-promised-files, equals: "promised-files: SparkError:E_UNSUPPORTED_PLATFORM" }
- assertText: { id: drag-drop-features-probe-spring-loading, equals: "spring-loading: SparkError:E_UNSUPPORTED_PLATFORM" }
- assertText: { id: drag-drop-features-probe-drag-image, equals: "drag-image: SparkError:E_UNSUPPORTED_PLATFORM" }
- assertText: { id: drag-drop-features-probe-operation-masks, equals: "operation-masks: SparkError:E_UNSUPPORTED_PLATFORM" }
