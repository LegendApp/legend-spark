appId: so.legend.spark.examples.kitchensink
name: Drag and drop availability on macOS
intent: >
  The Drag & drop features screen lists each getDragDropAvailability query as JSON. On macOS drag and drop, promised
  files, spring loading, custom drag images and operation masks report available.
checks: [DND-AVAIL-01]
tags: [drag-drop]
platforms: [macos]
---
- launchApp: { clearState: true, openUrl: "spark-ks://drag-drop/features" }
- extendedWaitUntil: { visible: { id: drag-drop-features-root }, timeout: 10s }
- assertText: { id: drag-drop-features-availability-module, equals: 'module: {"available":true}' }
- assertText: { id: drag-drop-features-availability-promised-files, equals: 'promised-files: {"available":true}' }
- assertText: { id: drag-drop-features-availability-spring-loading, equals: 'spring-loading: {"available":true}' }
- assertText: { id: drag-drop-features-availability-drag-image, equals: 'drag-image: {"available":true}' }
- assertText: { id: drag-drop-features-availability-operation-masks, equals: 'operation-masks: {"available":true}' }
