appId: so.legend.spark.examples.kitchensink
name: Interruption keeps velocity; release velocity, stop and set hand off
intent: >
  On Motion system > Springs and interruption, with the virtual clock frozen, a 4 s linear slide is
  interrupted 1 s in by a bouncy spring: the state read before and after the interruption is the same
  value (60) and velocity (60 pt/s), the slide reports finished false and the spring finished true.
  A release at 2400 pt/s seeds a snappy spring that overshoots. Stop freezes a running slide where it
  is with nothing animating, and Reset puts it back at 0 immediately. On the real clock an
  interruption at 25% of the slide is velocity-continuous.
checks: [MOT-INTERRUPT-01, MOT-HANDOFF-01, MOT-CLOCK-01]
tags: [motion-system]
platforms: [macos]
---
- launchApp: { clearState: true, openUrl: "spark-ks://motion-system/springs" }
- extendedWaitUntil: { visible: { id: motion-system-springs-root }, timeout: 10s }
- setClock: virtual
# The readout shows … once the start press is handled; the virtual clock advances only after that.
- tapOn: { id: motion-system-springs-start }
- assertText: { id: motion-system-springs-interruption-result, equals: "…" }
- advanceClock: 1s
- tapOn: { id: motion-system-springs-interrupt }
- advanceClock: 3s
- assertText: { id: motion-system-springs-interruption-result, equals: '{"before":{"value":60,"velocity":60},"after":{"value":60,"velocity":60},"finished":true}' }
- tapOn: { id: motion-system-springs-release }
- assertMotion: { target: { id: motion-system-springs-slider }, kind: spring, overshoot: { min: 5px } }
- advanceClock: 3s
- assertText: { id: motion-system-springs-interruption-result, equals: '{"finished":true}' }
- tapOn: { id: motion-system-springs-reset }
- assertText: { id: motion-system-springs-interruption-result, equals: '{"value":0,"velocity":0}' }
- tapOn: { id: motion-system-springs-start }
- assertText: { id: motion-system-springs-interruption-result, equals: "…" }
- advanceClock: 500ms
- tapOn: { id: motion-system-springs-stop }
- assertText: { id: motion-system-springs-interruption-result, equals: '{"value":30,"velocity":0,"animating":[]}' }
- advanceClock: 1s
- tapOn: { id: motion-system-springs-stop }
- assertText: { id: motion-system-springs-interruption-result, equals: '{"value":30,"velocity":0,"animating":[]}' }
- tapOn: { id: motion-system-springs-reset }
- assertText: { id: motion-system-springs-interruption-result, equals: '{"value":0,"velocity":0}' }
- setClock: real
- tapOn: { id: motion-system-springs-start }
- interruptAt: { target: { id: motion-system-springs-slider }, progress: 0.25, with: { tapOn: { id: motion-system-springs-interrupt } } }
- assertMotion: { target: { id: motion-system-springs-slider }, kind: spring, velocityContinuous: true, settlesWithin: 2s }
