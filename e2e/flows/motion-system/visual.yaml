appId: so.legend.spark.examples.kitchensink
name: Motion screens match their goldens
intent: >
  Each Motion system screen opens from its spark-ks:// deep link in the running Kitchen Sink, its root renders, and
  the main window matches the approved golden for the appearance (light and dark, English and Arabic), with the shell sidebar
  masked. Springs and Keyframes and timelines are at rest. Scroll link and JS block starts a looping runner on mount,
  so the motion clock is switched to virtual before that screen opens: the runner mounts paused at its start. Layout,
  presence and shared elements is at rest (its rows' enter animations start where they are).
checks: [MOT-VISUAL-01]
tags: [motion-system]
platforms: [macos]
matrix:
  appearance: [light, dark]
  locale: [en, ar]
---
- launchApp: { openUrl: "spark-ks://motion-system/springs" }
- assertVisible: { id: motion-system-springs-root }
- assertScreenshot: { golden: motion-system-springs, mask: [{ id: infra-shell-sidebar }] }
- launchApp: { openUrl: "spark-ks://motion-system/timelines", stopApp: false }
- assertVisible: { id: motion-system-timelines-root }
- assertScreenshot: { golden: motion-system-timelines, mask: [{ id: infra-shell-sidebar }] }
- setClock: virtual
- launchApp: { openUrl: "spark-ks://motion-system/scroll-and-frames", stopApp: false }
- assertVisible: { id: motion-system-scroll-and-frames-root }
- assertVisible: { id: motion-system-scroll-and-frames-loop }
- assertScreenshot: { golden: motion-system-scroll-and-frames, mask: [{ id: infra-shell-sidebar }] }
- launchApp: { openUrl: "spark-ks://motion-system/layout", stopApp: false }
- assertVisible: { id: motion-system-layout-root }
- assertVisible: { id: motion-system-layout-thumb-3 }
- assertScreenshot: { golden: motion-system-layout, mask: [{ id: infra-shell-sidebar }] }
