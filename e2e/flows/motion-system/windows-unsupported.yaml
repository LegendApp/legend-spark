appId: so.legend.spark.examples.kitchensink
name: Motion is typed unsupported on Windows
intent: >
  On Windows, every motion screen reports unsupported-platform from getMotionAvailability and shows
  SparkError:E_UNSUPPORTED_PLATFORM where its MotionViews would render, with no JavaScript-driven
  substitute; that includes the Layout, presence and shared elements screen (MotionPresence and MotionView) and the
  Backdrop materials (MotionMaterial), Shapes (MotionShape), and Shaders and particles (MotionShader, MotionEmitter)
  screens. The Windows engine, its Composition backdrop brushes, effects and particles are tracked in #237, its layout
  and presence support in #376.
checks: [MOT-UNSUP-01]
tags: [motion-system]
platforms: [windows]
---
- launchApp: { clearState: true, openUrl: "spark-ks://motion-system/springs" }
- extendedWaitUntil: { visible: { id: motion-system-springs-root }, timeout: 10s }
- assertText: { id: motion-system-springs-availability, equals: '{"available":false,"reason":"unsupported-platform"}' }
- assertText: { id: motion-system-springs-error, equals: SparkError:E_UNSUPPORTED_PLATFORM }
- launchApp: { stopApp: false, openUrl: "spark-ks://motion-system/timelines" }
- extendedWaitUntil: { visible: { id: motion-system-timelines-root }, timeout: 10s }
- assertText: { id: motion-system-timelines-availability, equals: '{"available":false,"reason":"unsupported-platform"}' }
- assertText: { id: motion-system-timelines-error, equals: SparkError:E_UNSUPPORTED_PLATFORM }
