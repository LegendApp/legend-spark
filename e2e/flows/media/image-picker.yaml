appId: so.legend.spark.examples.kitchensink
name: expo-image-picker on macOS
intent: >
  The Image picker screen finds the native module, reads the media library permission as granted (the open
  panel needs none) and a camera permission status, and gets ERR_UNAVAILABLE from launchCameraAsync, so the
  screen shows passed. The open panel itself needs a person to pick files.
checks: [MEDIA-IMAGEPICKER-01]
tags: [media]
platforms: [macos]
---
- launchApp: { clearState: true, openUrl: "spark-ks://media/image-picker" }
- extendedWaitUntil: { visible: { id: media-image-picker-passed }, timeout: 10s }
