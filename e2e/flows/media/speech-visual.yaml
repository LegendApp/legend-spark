appId: so.legend.spark.examples.kitchensink
name: Speech screen matches its golden
intent: >
  Media > Speech opens from spark-ks://media/speech with the simulated initial state (nothing speaking, both permissions
  undetermined, the en-US recognizer available on device) and no results yet. The main window matches the approved
  golden for the appearance and locale (light and dark, English and Arabic), with the shell sidebar and the installed
  voice count (it differs per Mac) masked.
checks: [MEDIA-VISUAL-01]
tags: [media]
platforms: [macos]
matrix:
  appearance: [light, dark]
  locale: [en, ar]
---
- launchApp: { openUrl: "spark-ks://media/speech" }
- assertText: { id: media-speech-speaking, equals: "speaking false · paused false" }
- assertText: { id: media-speech-permissions, equals: "speechRecognition undetermined · microphone undetermined" }
- assertText: { id: media-speech-recognizer, equals: "en-US · supported true · available true · on device true · listed true" }
- assertScreenshot: { golden: media-speech, mask: [{ id: infra-shell-sidebar }, { id: media-speech-voices }] }
