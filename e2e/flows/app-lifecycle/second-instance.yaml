appId: so.legend.spark.examples.kitchensink
name: Second launch forwards to the running instance
intent: >
  On App lifecycle > Launch & single instance, the app reports that it owns the single-instance
  lock. Launching it again with arguments, a file and a URL leaves one process running, brings the
  running app forward and lists that launch's arguments, file and URL under Second launches.
checks: [LIFE-INSTANCE-01, LIFE-INSTANCE-02]
tags: [app-lifecycle]
# Requires manual signoff until the black-box lifecycle backend is available.
manual: true
platforms: [macos, windows]
---
- launchApp: { clearState: true, openUrl: "spark-ks://app-lifecycle/launch" }
- extendedWaitUntil: { visible: { id: app-lifecycle-launch-root }, timeout: 10s }
- assertText: { id: app-lifecycle-launch-availability, equals: '{"available":true}' }
- assertText: { id: app-lifecycle-launch-instance, equals: Owns the single-instance lock }
- assertVisible: { id: app-lifecycle-launch-no-launches }
- launchSecondInstance:
    arguments: [--ks-second-launch]
    openFile: ${FIXTURES}/docs/notes.md
    openUrl: spark-ks://app-lifecycle/launch?from=second
- extendedWaitUntil: { visible: { id: app-lifecycle-launch-second-launch-0 }, timeout: 10s }
- assertSingleInstance
- assertAppState: { running: true, active: true }
- assertVisible: { id: app-lifecycle-launch-second-launch-0-arguments, text: "/--ks-second-launch/" }
- assertVisible: { id: app-lifecycle-launch-second-launch-0-files, text: "/docs[\\\\/]notes\\.md$/" }
- assertText: { id: app-lifecycle-launch-second-launch-0-urls, equals: "spark-ks://app-lifecycle/launch?from=second" }
- assertNotVisible: { id: app-lifecycle-launch-second-launch-1 }
