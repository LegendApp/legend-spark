appId: so.legend.spark.examples.kitchensink
name: Scroll direction and Native strings screens match their goldens
intent: >
  Internationalization > Scroll direction opens from spark-ks://internationalization/scroll-direction in the running
  Kitchen Sink, its root renders, and the main window matches the approved golden for the appearance and locale
  (light and dark, English and Arabic), with the shell sidebar masked. In Arabic the strip starts at the right edge.
  Native strings (spark-ks://internationalization/native-strings) matches its golden once its languages load;
  no language is chosen and no dialog opened.
checks: [I18N-VISUAL-01, I18N-VISUAL-02]
tags: [internationalization]
platforms: [macos]
matrix:
  appearance: [light, dark]
  locale: [en, ar]
---
- launchApp: { openUrl: "spark-ks://internationalization/scroll-direction" }
- assertVisible: { id: internationalization-scroll-direction-root }
- assertScreenshot: { golden: internationalization-scroll-direction, mask: [{ id: infra-shell-sidebar }] }
- launchApp: { openUrl: "spark-ks://internationalization/native-strings", stopApp: false }
- assertVisible: { id: internationalization-native-strings-current }
- assertScreenshot: { golden: internationalization-native-strings, mask: [{ id: infra-shell-sidebar }] }
