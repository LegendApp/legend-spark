appId: so.legend.spark.examples.kitchensink
name: Sign in with Apple resolves the credential or the person's cancel; the credential state follows Apple's answer (simulated)
intent: >
  With the Sign in with Apple entitlement simulated, Sign in without a simulated answer rejects SparkError:E_UNAVAILABLE
  and nothing is shown. With answer success it is presented over the main window (spark.main) and resolves the made-up
  credential: the user, the email and name the fullName and email scopes asked for, and the state echoed. Credential
  state then reports authorized, and revoked when Apple says so. With answer cancel, Sign in resolves cancel. Driver
  simulation only: no sheet appears and Apple's servers are never reached.
checks: [AUTH-SIWA-01, AUTH-SIWASTATE-01]
tags: [authentication]
platforms: [macos]
---
- launchApp: { openUrl: "spark-ks://authentication/sign-in" }
- simulateAuthorization: { appleId: true }
- tapOn: { id: authentication-sign-in-availability-refresh }
- assertText: { id: authentication-sign-in-availability-apple, equals: '{"available":true}' }
- tapOn: { id: authentication-sign-in-apple-sign-in }
- assertText: { id: authentication-sign-in-apple-result, equals: "SparkError:E_UNAVAILABLE" }
- assertSimulatedAuthorization: { requests: 0 }
- simulateAuthorization: { answer: success }
- tapOn: { id: authentication-sign-in-apple-sign-in }
- assertText: { id: authentication-sign-in-apple-result, equals: "success: user 001234.simulated.0001 · email simulated@privaterelay.appleid.com · name Spark Tester · state kitchen-sink" }
- assertSimulatedAuthorization: { requests: 1, pending: 0, lastOperation: appleId, lastWindow: spark.main }
- tapOn: { id: authentication-sign-in-apple-state-check }
- assertText: { id: authentication-sign-in-apple-state, equals: authorized }
- simulateAuthorization: { credentialState: revoked }
- tapOn: { id: authentication-sign-in-apple-state-check }
- assertText: { id: authentication-sign-in-apple-state, equals: revoked }
- simulateAuthorization: { answer: cancel }
- tapOn: { id: authentication-sign-in-apple-sign-in }
- assertText: { id: authentication-sign-in-apple-result, equals: cancel }
- assertSimulatedAuthorization: { requests: 2, pending: 0 }
- takeScreenshot: sign-in-apple
