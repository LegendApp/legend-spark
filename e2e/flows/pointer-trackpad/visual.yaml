appId: so.legend.spark.examples.kitchensink
name: Pointer screen matches its goldens
intent: >
  The Pointer screen opens from its spark-ks:// deep link and matches the approved golden for the appearance
  (light and dark) and locale (English and Arabic), with the shell sidebar masked.
checks: [PTR-VISUAL-01]
tags: [pointer-trackpad]
platforms: [macos]
matrix:
  appearance: [light, dark]
  locale: [en, ar]
---
- launchApp: { openUrl: "spark-ks://pointer-trackpad/pointer" }
- assertVisible: { id: pointer-trackpad-pointer-root }
- assertScreenshot: { golden: pointer-trackpad-pointer, mask: [{ id: infra-shell-sidebar }] }
