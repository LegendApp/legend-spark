appId: so.legend.spark.examples.kitchensink
name: Shortcut map availability on macOS
intent: >
  The Shortcut map screen lists getShortcutMapAvailability for each scope as JSON. On macOS the
  keyboard manager serves application, window and view commands and global hotkeys serve global ones.
checks: [KEY-MAPAVAIL-01]
tags: [keyboard]
platforms: [macos]
---
- launchApp: { openUrl: "spark-ks://keyboard/shortcut-map" }
- extendedWaitUntil: { visible: { id: keyboard-shortcut-map-commands }, timeout: 15s }
- assertText: { id: keyboard-shortcut-map-availability-application, equals: 'application: {"available":true}' }
- assertText: { id: keyboard-shortcut-map-availability-window, equals: 'window: {"available":true}' }
- assertText: { id: keyboard-shortcut-map-availability-view, equals: 'view: {"available":true}' }
- assertText: { id: keyboard-shortcut-map-availability-global, equals: 'global: {"available":true}' }
