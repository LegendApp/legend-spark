appId: so.legend.spark.examples.kitchensink
name: Keyboard screens match their goldens
intent: >
  The Keyboard monitor screen opens from its spark-ks:// deep link and matches its approved golden in light and dark,
  English and Arabic, with the shell sidebar masked.
checks: [KEY-VISUAL-01]
tags: [keyboard]
platforms: [macos]
matrix:
  appearance: [light, dark]
  locale: [en, ar]
---
- launchApp: { openUrl: "spark-ks://keyboard/keyboard" }
- assertVisible: { id: keyboard-keyboard-root }
- assertScreenshot: { golden: keyboard-keyboard, mask: [{ id: infra-shell-sidebar }] }
