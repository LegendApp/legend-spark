appId: so.legend.spark.examples.kitchensink
name: react-native-keyboard-controller on macOS
intent: >
  The Keyboard controller screen renders KeyboardProvider, KeyboardAwareScrollView, a text input and
  KeyboardToolbar, and both useKeyboardState and KeyboardController report the keyboard hidden, so the screen
  shows passed.
checks: [KEY-CONTROLLER-01]
tags: [keyboard]
platforms: [macos]
---
- launchApp: { clearState: true, openUrl: "spark-ks://keyboard/keyboard-controller" }
- extendedWaitUntil: { visible: { id: keyboard-keyboard-controller-passed }, timeout: 10s }
