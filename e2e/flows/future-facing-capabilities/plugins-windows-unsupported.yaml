appId: so.legend.spark.examples.kitchensink
name: Plugins are typed unsupported on Windows
intent: >
  On Windows the Plugins screen reports getPluginAvailability() as unsupported-platform, and loading a plugin rejects
  SparkError:E_UNSUPPORTED_PLATFORM without starting a runtime. Not yet run on Windows. Implementation: #390.
checks: [FUT-PLUGINUNSUP-01]
tags: [future-facing-capabilities]
platforms: [windows]
---
- launchApp: { openUrl: "spark-ks://future-facing-capabilities/plugins" }
- extendedWaitUntil: { visible: { id: future-facing-capabilities-plugins-root }, timeout: 10s }
- assertText: { id: future-facing-capabilities-plugins-availability, equals: '{"available":false,"reason":"unsupported-platform"}' }
- tapOn: { id: future-facing-capabilities-plugins-echo-load }
- assertText: { id: future-facing-capabilities-plugins-echo-result, equals: "SparkError:E_UNSUPPORTED_PLATFORM" }
- assertText: { id: future-facing-capabilities-plugins-echo-state, equals: "failed (E_UNSUPPORTED_PLATFORM)" }
