appId: so.legend.spark.examples.kitchensink
name: Unloading a plugin withdraws its contributions and destroys its runtime
intent: >
  With Hello loaded and greeted twice, unloading it withdraws its commands, menu item (the Plugins menu disappears),
  file type and panel. Loading it again starts a fresh heap: the greeting count starts over.
checks: [FUT-PLUGINUNLOAD-01]
tags: [future-facing-capabilities]
platforms: [macos]
---
- launchApp: { clearState: true, openUrl: "spark-ks://future-facing-capabilities/plugins" }
- tapOn: { id: future-facing-capabilities-plugins-hello-load }
# A dev build's first worker in a run can wait for the worker entry the driver bundles in the background from session
# start (scripts/e2e/bundle-server.ts): about 5 s with a warm Metro cache, so 30 s leaves room for a busy Mac.
- assertText: { id: future-facing-capabilities-plugins-hello-state, equals: loaded, timeout: 30s }
- tapOn: { id: future-facing-capabilities-plugins-command-hello-greet }
- assertText: { id: future-facing-capabilities-plugins-output, equals: '{"greeting":"Hello","runtime":"spark-plugin.so.legend.ks.hello","main":false,"hostGlobalVisible":false,"greetings":1}' }
- tapOn: { id: future-facing-capabilities-plugins-command-hello-greet }
- assertText: { id: future-facing-capabilities-plugins-output, equals: '{"greeting":"Hello","runtime":"spark-plugin.so.legend.ks.hello","main":false,"hostGlobalVisible":false,"greetings":2}' }
- assertAppMenu: { path: "Plugins > Greet from the menu" }
- tapOn: { id: future-facing-capabilities-plugins-hello-unload }
- assertText: { id: future-facing-capabilities-plugins-hello-result, equals: unloaded }
- assertText: { id: future-facing-capabilities-plugins-hello-state, equals: unloaded }
- assertVisible: { id: future-facing-capabilities-plugins-none }
- assertNotVisible: { id: future-facing-capabilities-plugins-command-hello-greet }
- assertNotVisible: { id: future-facing-capabilities-plugins-menu-hello-menu-greet }
- assertNotVisible: { id: future-facing-capabilities-plugins-open-sample }
- assertNotVisible: { id: future-facing-capabilities-plugins-panel-hello-panel }
- assertAppMenu: { path: "Plugins > Greet from the menu", exists: false }
- tapOn: { id: future-facing-capabilities-plugins-hello-load }
- assertText: { id: future-facing-capabilities-plugins-hello-state, equals: loaded }
- tapOn: { id: future-facing-capabilities-plugins-command-hello-greet }
- assertText: { id: future-facing-capabilities-plugins-output, equals: '{"greeting":"Hello","runtime":"spark-plugin.so.legend.ks.hello","main":false,"hostGlobalVisible":false,"greetings":1}' }
