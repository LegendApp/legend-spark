appId: so.legend.spark.examples.kitchensink
name: Accessibility audit of the catalog and area pages
intent: >
  The Kitchen Sink shell's own pages, the catalog (All screens) and the page of every area, each opened from its
  spark-ks:// link in the running app, pass the accessibility audit of the main window with no errors: every control
  and image has a label or title, every control takes keyboard focus, and all enabled text meets the HIG contrast
  ratio against what is rendered behind it. The sidebar, breadcrumb and theme toggle are audited on every page. Runs
  in light and dark, in English and Arabic (right to left).
checks: [A11Y-AUDIT-01]
tags: [accessibility]
platforms: [macos]
matrix:
  appearance: [light, dark]
  locale: [en, ar]
---
- launchApp
- assertVisible: { id: infra-shell-home }
- auditAccessibility: { maxErrors: 0 }
- runFlow: { file: subflows/accessibility/audit-area.yaml, env: { AREA: infra } }
- runFlow: { file: subflows/accessibility/audit-area.yaml, env: { AREA: app-lifecycle } }
- runFlow: { file: subflows/accessibility/audit-area.yaml, env: { AREA: windows } }
