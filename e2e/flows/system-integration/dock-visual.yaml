appId: so.legend.spark.examples.kitchensink
name: Dock & taskbar screen matches its golden
intent: >
  System integration > Dock & taskbar opens from spark-ks://system-integration/dock with its
  availability readouts and no results yet. The main window matches the approved golden for the
  appearance and locale (light and dark, English and Arabic), with the shell sidebar masked.
checks: [SYS-DOCKVISUAL-01]
tags: [system-integration]
platforms: [macos]
matrix:
  appearance: [light, dark]
  locale: [en, ar]
---
- launchApp: { openUrl: "spark-ks://system-integration/dock" }
- assertVisible: { id: system-integration-dock-root }
- assertScreenshot: { golden: system-integration-dock, mask: [{ id: infra-shell-sidebar }] }
