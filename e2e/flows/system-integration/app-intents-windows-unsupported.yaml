appId: so.legend.spark.examples.kitchensink
name: App Intents are typed unsupported on Windows
intent: >
  On Windows the App Intents & Shortcuts screen reports App Intents unsupported-platform. Listing the declared intents,
  registering both handlers and donating reject SparkError:E_UNSUPPORTED_PLATFORM, which the screen shows. Not yet run
  on Windows. Windows App Actions: #415.
checks: [SYS-INTENTSUNSUP-01]
tags: [system-integration]
platforms: [windows]
---
- launchApp: { openUrl: "spark-ks://system-integration/app-intents" }
- extendedWaitUntil: { visible: { id: system-integration-app-intents-root }, timeout: 10s }
- assertText: { id: system-integration-app-intents-availability, equals: '{"available":false,"reason":"unsupported-platform"}' }
- assertText: { id: system-integration-app-intents-declared, equals: SparkError:E_UNSUPPORTED_PLATFORM }
- assertText: { id: system-integration-app-intents-status-ksShowRecipe, equals: SparkError:E_UNSUPPORTED_PLATFORM }
- assertText: { id: system-integration-app-intents-status-ksStartTimer, equals: SparkError:E_UNSUPPORTED_PLATFORM }
- tapOn: { id: system-integration-app-intents-donate }
- assertText: { id: system-integration-app-intents-donation, equals: SparkError:E_UNSUPPORTED_PLATFORM }
