appId: so.legend.spark.examples.kitchensink
name: Dock badge, progress and Dock menu on macOS
intent: >
  System integration > Dock & taskbar reports the system module, app badge, app progress, attention
  and the Dock menu available on macOS, and the taskbar menu unsupported-platform.
  Badge text "New", count 3, 1,250 and clear resolve ok; progress 35%, indeterminate, paused at 60%,
  error at 80% and clear resolve ok, and 150% rejects SparkError:E_INVALID_ARGUMENT. The launcher
  menu installs a Dock menu with a submenu and its removal reports "removed". The flow ends with the
  badge and progress cleared. A
  driven app has no Dock icon, so nothing appears in the Dock; tests/dock-tile-native.test.ts checks
  the Dock tile itself. Attention is in attention.yaml (manual: it bounces the real Dock icon).
checks: [SYS-DOCKAVAIL-01, SYS-BADGE-01, SYS-PROGRESS-01, SYS-DOCKMENU-01]
tags: [system-integration]
platforms: [macos]
---
- launchApp: { clearState: true, openUrl: "spark-ks://system-integration/dock" }
- extendedWaitUntil: { visible: { id: system-integration-dock-root }, timeout: 10s }
- assertText: { id: system-integration-dock-availability-system, equals: 'system: {"available":true}' }
- assertText: { id: system-integration-dock-availability-appBadge, equals: 'appBadge: {"available":true}' }
- assertText: { id: system-integration-dock-availability-appProgress, equals: 'appProgress: {"available":true}' }
- assertText: { id: system-integration-dock-availability-attention, equals: 'attention: {"available":true}' }
- assertText: { id: system-integration-dock-availability-dockMenu, equals: 'dockMenu: {"available":true}' }
- assertText: { id: system-integration-dock-availability-taskbarMenu, equals: 'taskbarMenu: {"available":false,"reason":"unsupported-platform"}' }
# Badge
- tapOn: { id: system-integration-dock-badge-text }
- assertText: { id: system-integration-dock-badge-text-result, equals: ok }
- tapOn: { id: system-integration-dock-badge-count }
- assertText: { id: system-integration-dock-badge-count-result, equals: ok }
- tapOn: { id: system-integration-dock-badge-large }
- assertText: { id: system-integration-dock-badge-large-result, equals: ok }
- tapOn: { id: system-integration-dock-badge-clear }
- assertText: { id: system-integration-dock-badge-clear-result, equals: ok }
# Progress
- tapOn: { id: system-integration-dock-progress-35 }
- assertText: { id: system-integration-dock-progress-35-result, equals: ok }
- tapOn: { id: system-integration-dock-progress-indeterminate }
- assertText: { id: system-integration-dock-progress-indeterminate-result, equals: ok }
- tapOn: { id: system-integration-dock-progress-paused }
- assertText: { id: system-integration-dock-progress-paused-result, equals: ok }
- tapOn: { id: system-integration-dock-progress-error }
- assertText: { id: system-integration-dock-progress-error-result, equals: ok }
- tapOn: { id: system-integration-dock-progress-invalid }
- assertText: { id: system-integration-dock-progress-invalid-result, equals: SparkError:E_INVALID_ARGUMENT }
- tapOn: { id: system-integration-dock-progress-clear }
- assertText: { id: system-integration-dock-progress-clear-result, equals: ok }
# Dock menu
- tapOn: { id: system-integration-dock-launcher-install }
- assertText: { id: system-integration-dock-launcher-install-result, equals: installed }
- tapOn: { id: system-integration-dock-launcher-remove }
- assertText: { id: system-integration-dock-launcher-remove-result, equals: removed }
