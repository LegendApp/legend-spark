appId: so.legend.spark.examples.kitchensink
name: System information, network status and feature availability
intent: >
  System integration > System state opens from spark-ks://system-integration/state and shows what
  @legendapp/spark/system reports: every macOS feature is available, getSystemInfo fills each field and
  getNetworkStatus reports the path. A driver run reports fixed values for the host's power, idle time, time zone,
  thermal state and network (docs/system.md#testing-system-events), so the flow asserts them exactly; the OS
  version, architecture and Rosetta belong to the Mac and build, so the flow asserts they rendered.
  tests/system-events.native.mm checks the real reads. Nothing on the Mac is changed.
checks: [SYS-STATEAVAIL-01, SYS-INFO-01, SYS-NET-01]
tags: [system-integration]
platforms: [macos]
---
- launchApp: { openUrl: "spark-ks://system-integration/state" }
- assertVisible: { id: system-integration-state-root }
- assertText: { id: system-integration-state-availability-thermalState, equals: '{"available":true}' }
- assertText: { id: system-integration-state-availability-networkStatus, equals: '{"available":true}' }
- assertText: { id: system-integration-state-availability-memoryPressure, equals: '{"available":true}' }
- assertText: { id: system-integration-state-availability-lowPowerChanges, equals: '{"available":true}' }
- assertText: { id: system-integration-state-availability-timeZoneChanges, equals: '{"available":true}' }
- assertVisible: { text: "/\\d+\\.\\d+/", within: { id: system-integration-state-os-version } }
- assertVisible: { text: "/^(arm64|x64)$/", within: { id: system-integration-state-architecture } }
- assertVisible: { text: "/^(Yes|No)$/", within: { id: system-integration-state-translated } }
- assertText: { id: system-integration-state-time-zone, equals: UTC }
- assertText: { id: system-integration-state-idle, equals: 0 s }
- assertText: { id: system-integration-state-power-source, equals: Power adapter }
- assertText: { id: system-integration-state-battery, equals: No battery }
- assertText: { id: system-integration-state-low-power, equals: "No" }
- assertText: { id: system-integration-state-thermal, equals: nominal }
- assertText: { id: system-integration-state-network-status, equals: online }
- assertText: { id: system-integration-state-network-interfaces, equals: wired }
- assertText: { id: system-integration-state-network-expensive, equals: "No" }
- assertText: { id: system-integration-state-network-constrained, equals: "No" }
- assertText: { id: system-integration-state-network-proxies, equals: None }
- assertNotVisible: { id: system-integration-state-error }
