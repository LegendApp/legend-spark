appId: so.legend.spark.examples.kitchensink
name: Hang watchdog availability on macOS
intent: >
  The Hang watchdog screen shows getHangWatchdogAvailability() as JSON: available on macOS. The
  screen starts a watchdog when it opens, at the default 250 ms threshold.
checks: [REL-HANG-01]
tags: [reliability-diagnostics]
platforms: [macos]
---
- launchApp: { clearState: true, openUrl: "spark-ks://reliability-diagnostics/hang-watchdog" }
- extendedWaitUntil: { visible: { id: reliability-diagnostics-hang-watchdog-root }, timeout: 10s }
- assertText: { id: reliability-diagnostics-hang-watchdog-availability, equals: '{"available":true}' }
- extendedWaitUntil: { visible: { text: "watching 250", within: { id: reliability-diagnostics-hang-watchdog-state } }, timeout: 5s }
