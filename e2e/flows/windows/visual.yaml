appId: so.legend.spark.examples.kitchensink
name: Windows screens match their goldens
intent: >
  The Window manager and Window controls screens open from their spark-ks:// deep links and match their approved
  goldens in light and dark, English and Arabic, with the shell sidebar masked.
checks: [WIN-VISUAL-01]
tags: [windows]
platforms: [macos]
matrix:
  appearance: [light, dark]
  locale: [en, ar]
---
- launchApp: { openUrl: "spark-ks://windows/window-manager" }
- assertVisible: { id: windows-window-manager-root }
# The frame readout is centered and its length changes with the display ID and position, so its whole row is masked.
- assertScreenshot: { golden: windows-window-manager, mask: [{ id: infra-shell-sidebar }], maskRects: [{ x: 0, y: 196, w: 1000, h: 22 }] }
- launchApp: { openUrl: "spark-ks://windows/window-controls", stopApp: false }
- assertVisible: { id: windows-window-controls-root }
- assertScreenshot: { golden: windows-window-controls, mask: [{ id: infra-shell-sidebar }] }
