appId: so.legend.spark.examples.kitchensink
name: Multiwindow screens match their goldens
intent: >
  Multiwindow > Multiwindow opens from spark-ks://multiwindow/windows in the running Kitchen Sink, its root renders,
  and the main window matches the approved golden for the appearance (light and dark, English and Arabic), with the shell
  sidebar masked. No window is opened, so the open-window list is empty. Multiwindow > Special windows then opens from
  spark-ks://multiwindow/special-windows and matches its golden the same way, with no special window open (every row
  reads closed). Multiwindow > Window performance then opens from spark-ks://multiwindow/performance and matches its
  golden with nothing run yet (every readout row empty). Multiwindow > Window choreography then opens from
  spark-ks://multiwindow/choreography and matches its golden with no window open (every window row reads closed).
checks: [MW-VISUAL-01]
tags: [multiwindow]
platforms: [macos]
matrix:
  appearance: [light, dark]
  locale: [en, ar]
---
- launchApp: { openUrl: "spark-ks://multiwindow/windows" }
- assertVisible: { id: multiwindow-windows-root }
- assertScreenshot: { golden: multiwindow-windows, mask: [{ id: infra-shell-sidebar }] }
- launchApp: { openUrl: "spark-ks://multiwindow/special-windows", stopApp: false }
- assertVisible: { id: multiwindow-special-windows-root }
- assertScreenshot: { golden: multiwindow-special-windows, mask: [{ id: infra-shell-sidebar }] }
- launchApp: { openUrl: "spark-ks://multiwindow/performance", stopApp: false }
- assertVisible: { id: multiwindow-performance-root }
- assertScreenshot: { golden: multiwindow-performance, mask: [{ id: infra-shell-sidebar }] }
- launchApp: { openUrl: "spark-ks://multiwindow/choreography", stopApp: false }
- assertVisible: { id: multiwindow-choreography-root }
- assertScreenshot: { golden: multiwindow-choreography, mask: [{ id: infra-shell-sidebar }] }
