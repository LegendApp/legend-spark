appId: so.legend.spark.examples.kitchensink
name: Window choreography follows Reduce Motion
intent: >
  On Multiwindow > Window choreography with the virtual clock and one simulated display (901), the driver simulates
  Reduce Motion (the Mac's setting is untouched), and the screen reads it back. Opening the detail window from the thumbnail shows it at its frame
  (556,357, 400 × 300) at once, fading in, and the zoom reports Reduce Motion when it ends; Full size changes the frame
  at once to 720 × 480 and reports Reduce Motion. With Reduce Motion off again, closing shrinks the window over time
  (halfway into the thumbnail 150 ms in) and closes it.
checks: [MW-CHOREO-06]
tags: [multiwindow]
platforms: [macos]
timeout: 120s
---
- launchApp
- simulateDisplays:
    displays:
      - { id: "901", persistentId: SIM-901, name: Built-in Retina Display, primary: true, origin: { x: 0, y: 0 }, size: { width: 1512, height: 982 }, workArea: { x: 0, y: 32, width: 1512, height: 950 }, scaleFactor: 2, safeArea: { top: 32, left: 0, bottom: 0, right: 0 }, refreshRate: { minimum: 24, maximum: 120, variable: true }, colorSpace: { name: Color LCD, gamut: p3 }, edrHeadroom: { current: 1, potential: 16, reference: null } }
- launchApp: { stopApp: false, openUrl: "spark-ks://multiwindow/choreography" }
- extendedWaitUntil: { visible: { id: multiwindow-choreography-root }, timeout: 10s }
- setClock: virtual
- simulateSystemEvent: { type: accessibilityDisplayChanged, reduceMotion: true }
- assertVisible: { id: multiwindow-choreography-reduce-motion-true }
- launchApp: { stopApp: false, openUrl: "spark-ks://multiwindow/choreography?run=zoom-thumb" }
- assertVisible: { id: multiwindow-choreography-run-1-steps-1 }
- assertVisible: { id: multiwindow-choreography-detail-shown-901-556-357-400x300 }
- assertVisible: { id: multiwindow-choreography-animation-pending }
- advanceClock: 300ms
- extendedWaitUntil: { visible: { id: multiwindow-choreography-animation-reduced }, timeout: 5s }
- launchApp: { stopApp: false, openUrl: "spark-ks://multiwindow/choreography?run=keep,full" }
- assertVisible: { id: multiwindow-choreography-run-2-steps-2 }
- assertVisible: { id: multiwindow-choreography-detail-shown-901-556-357-720x480 }
- extendedWaitUntil: { visible: { id: multiwindow-choreography-animation-reduced }, timeout: 5s }
- simulateSystemEvent: { type: accessibilityDisplayChanged, reduceMotion: false }
- assertVisible: { id: multiwindow-choreography-reduce-motion-false }
- launchApp: { stopApp: false, openUrl: "spark-ks://multiwindow/choreography?run=keep,close" }
- assertVisible: { id: multiwindow-choreography-run-3-steps-2 }
- advanceClock: 150ms
- tapOn: { id: multiwindow-choreography-refresh }
- assertVisible: { id: multiwindow-choreography-detail-shown-901-278-207-380x255 }
- advanceClock: 150ms
- extendedWaitUntil: { visible: { id: multiwindow-choreography-close-closed }, timeout: 5s }
- assertNotVisible: { id: multiwindow-choreography-error-other }
- setClock: real
- simulateDisplays: { restore: true }
