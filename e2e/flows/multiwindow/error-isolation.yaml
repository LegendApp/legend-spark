appId: so.legend.spark.examples.kitchensink
name: Per-window error isolation
intent: A render error in the error-isolation window shows the "This window stopped working." fallback there only; a note window keeps working, the main screen lists the error, and Try again restores the window.
checks: [MW-ERROR-01]
---
- launchApp: { clearState: true, openUrl: "spark-ks://multiwindow/windows" }
- tapOn: { id: multiwindow-windows-open-note }
- focusWindow: { id: spark.main }
- tapOn: { id: multiwindow-windows-open-crash }
- tapOn: { id: multiwindow-crash-throw, window: { title: Error isolation } }
- assertVisible: { id: spark-window-error, window: { title: Error isolation } }
- assertVisible: { text: "This window stopped working.", window: { title: Error isolation } }
- tapOn: { id: multiwindow-note-star, window: { title: "Note 1" } }
- assertVisible: { text: "Stars: 1 · this window", window: { title: "Note 1" } }
- assertVisible: { text: "/render: Render failure in this window only$/", within: { id: multiwindow-windows-open } }
- tapOn: { id: spark-window-error-retry, window: { title: Error isolation } }
- assertVisible: { id: multiwindow-crash-throw, window: { title: Error isolation } }
