appId: so.legend.spark.examples.kitchensink
name: Presenter mode on two simulated displays
intent: >
  Multiwindow > Special windows starts presenter mode from a spark-ks://multiwindow/special-windows?run=… deep link
  (each run starts with no special windows open). With one simulated display, 901, it rejects E_UNAVAILABLE and opens
  nothing. With 901 (primary, 1512 × 982, a 32-point menu bar) and 902 (1920 × 1080) to its right, the audience
  window fills 902 and the controller is centered in 901's work area at 1000 × 700; swapping exchanges them.
  Disconnecting 902 (simulateDisplays with 901 alone) ends presenter mode with displayRemoved and closes both
  windows. Window geometry uses the simulated displays; the driver never shows windows. The flow restores the real
  displays at the end.
checks: [MW-SPECIAL-09]
tags: [multiwindow]
platforms: [macos]
timeout: 90s
---
- launchApp
- simulateDisplays:
    displays:
      - &primary { id: "901", persistentId: SIM-901, name: Built-in Retina Display, primary: true, origin: { x: 0, y: 0 }, size: { width: 1512, height: 982 }, workArea: { x: 0, y: 32, width: 1512, height: 950 }, scaleFactor: 2, safeArea: { top: 32, left: 0, bottom: 0, right: 0 }, refreshRate: { minimum: 24, maximum: 120, variable: true }, colorSpace: { name: Color LCD, gamut: p3 }, edrHeadroom: { current: 1, potential: 16, reference: null } }
- launchApp: { stopApp: false, openUrl: "spark-ks://multiwindow/special-windows" }
- extendedWaitUntil: { visible: { id: multiwindow-special-windows-root }, timeout: 10s }
- launchApp: { stopApp: false, openUrl: "spark-ks://multiwindow/special-windows?run=presenter" }
- assertVisible: { id: multiwindow-special-windows-run-1-steps-1 }
- assertVisible: { id: multiwindow-special-windows-error-E_UNAVAILABLE }
- assertText: { id: multiwindow-special-windows-audience, equals: closed }
- assertText: { id: multiwindow-special-windows-controller, equals: closed }
- simulateDisplays:
    displays:
      - *primary
      - { id: "902", persistentId: SIM-902, name: HD Monitor, primary: false, origin: { x: 1512, y: 0 }, size: { width: 1920, height: 1080 }, workArea: { x: 0, y: 0, width: 1920, height: 1080 }, scaleFactor: 1, safeArea: { top: 0, left: 0, bottom: 0, right: 0 }, refreshRate: { minimum: 60, maximum: 60, variable: false }, colorSpace: { name: sRGB IEC61966-2.1, gamut: srgb }, edrHeadroom: { current: 1, potential: 1, reference: null } }
- launchApp: { stopApp: false, openUrl: "spark-ks://multiwindow/special-windows?run=presenter" }
- assertVisible: { id: multiwindow-special-windows-run-2-steps-1 }
- assertText: { id: multiwindow-special-windows-presenter, equals: "Presenter mode: audience on 902, controller on 901" }
- assertText: { id: multiwindow-special-windows-audience, equals: "shown on 902 at 0,0 size 1920x1080" }
- assertText: { id: multiwindow-special-windows-controller, equals: "shown on 901 at 256,157 size 1000x700" }
- takeScreenshot: { name: special-presenter-audience, window: { id: ks-special-audience } }
- launchApp: { stopApp: false, openUrl: "spark-ks://multiwindow/special-windows?run=presenter,presenter-swap" }
- assertVisible: { id: multiwindow-special-windows-run-3-steps-2 }
- assertText: { id: multiwindow-special-windows-presenter, equals: "Presenter mode: audience on 901, controller on 902" }
- assertText: { id: multiwindow-special-windows-audience, equals: "shown on 901 at 0,0 size 1512x982" }
- assertText: { id: multiwindow-special-windows-controller, equals: "shown on 902 at 460,190 size 1000x700" }
- simulateDisplays:
    displays:
      - *primary
- extendedWaitUntil: { visible: { id: multiwindow-special-windows-presenter, text: "Presenter mode: ended: displayRemoved" }, timeout: 5s }
- extendedWaitUntil: { visible: { id: multiwindow-special-windows-audience, text: closed }, timeout: 5s }
- assertText: { id: multiwindow-special-windows-controller, equals: closed }
- simulateDisplays: { restore: true }
