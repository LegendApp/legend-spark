appId: so.legend.spark.examples.kitchensink
name: Workspaces with Spaces, Stage Manager, fullscreen and real displays, by hand
intent: >
  What only the window server and a person show. A restored workspace opens on the active Space; with Stage Manager on
  its windows arrive as new windows do; a window saved in fullscreen returns to fullscreen in a Space of its own; and
  unplugging a real external display adapts the layout. macOS has no public API to place windows on other Spaces or to
  read or set Stage Manager, so these are observed, not controlled. The driver never shows windows, so this does not
  run in-process.
checks: [MW-WORKSPACE-06]
tags: [multiwindow]
platforms: [macos]
build: release
manual: true
timeout: 20m
---
- launchApp: { clearState: true, openUrl: "spark-ks://multiwindow/workspaces" }
- tapOn: { id: multiwindow-workspaces-editor-button }
- tapOn: { id: multiwindow-workspaces-inspector-button }
- manualStep:
    instruction: 'Move the editor to the left half and the inspector to the right half of the screen. Choose Window › Workspaces › Save Workspace… (⌥⌘S). Close both windows, switch to another desktop Space with Mission Control, return to the Kitchen Sink and press ⌃⌘1.'
    expect: 'Desk is listed on the screen and in Window › Workspaces with ⌃⌘1. ⌃⌘1 opens both windows at their saved places on the Space you are on now, not the Space they were saved on.'
    evidence: none
    signoff: required
- manualStep:
    instruction: 'Turn on Stage Manager in Control Center. Press ⌃⌘1 again, then turn Stage Manager off.'
    expect: 'The windows close and reopen; Stage Manager shows them as the Kitchen Sink''s windows in the stage, as it does for any new windows. Nothing hangs and no error is shown.'
    evidence: none
    signoff: required
- manualStep:
    instruction: 'Make the editor fullscreen (green button), save the workspace as Desk again (⌥⌘S), leave fullscreen, close both windows and press ⌃⌘1.'
    expect: 'The inspector opens at its place and the editor goes into fullscreen in a Space of its own (Mission Control shows it as its own Space).'
    evidence: none
    signoff: required
- manualStep:
    instruction: 'With an external display connected, put the inspector on it and save the workspace as Desk. Unplug the display, then press ⌃⌘1.'
    expect: 'The inspector opens on the built-in display at the same relative place, scaled to fit; the screen''s Last restore row says scaled for it.'
    evidence: none
    signoff: required
