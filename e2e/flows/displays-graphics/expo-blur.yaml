appId: so.legend.spark.examples.kitchensink
name: expo-blur on macOS
intent: >
  The Expo Blur screen finds the native module linked and lays out light, dark and system-material blur
  views over colored stripes; the capture records how the materials look.
checks: [DISP-EXPOBLUR-01]
tags: [displays-graphics]
platforms: [macos]
---
- launchApp: { clearState: true, openUrl: "spark-ks://displays-graphics/expo-blur" }
- extendedWaitUntil: { visible: { id: displays-graphics-expo-blur-native }, timeout: 10s }
- assertVisible: { id: displays-graphics-expo-blur-light-laid-out }
- assertVisible: { id: displays-graphics-expo-blur-dark-laid-out }
- assertVisible: { id: displays-graphics-expo-blur-systemMaterial-laid-out }
- takeScreenshot: expo-blur
