appId: so.legend.spark.examples.kitchensink
name: react-native-graph on macOS
intent: >
  The Graph screen renders a static and an animated line graph; both lay out instead of the screen's error
  boundary catching Skia 1 path calls that Skia 2 removed. Skia content isn't in driver captures.
checks: [DISP-GRAPH-01]
tags: [displays-graphics]
platforms: [macos]
---
- launchApp: { clearState: true, openUrl: "spark-ks://displays-graphics/graph" }
- extendedWaitUntil: { visible: { id: displays-graphics-graph-static-laid-out }, timeout: 10s }
- assertVisible: { id: displays-graphics-graph-animated-laid-out }
