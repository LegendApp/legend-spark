appId: so.legend.spark.examples.kitchensink
name: Display details are typed unsupported on Windows
intent: >
  On Windows the Displays screen reports getDisplayAvailability() as unsupported-platform, and
  registering its display listener rejects SparkError:E_UNSUPPORTED_PLATFORM, which the screen
  shows; no display card appears. Implementation: #318.
checks: [DISP-UNSUP-01]
tags: [displays-graphics]
platforms: [windows]
---
- launchApp: { openUrl: "spark-ks://displays-graphics/displays" }
- extendedWaitUntil: { visible: { id: displays-graphics-displays-root }, timeout: 10s }
- assertText: { id: displays-graphics-displays-availability, equals: '{"available":false,"reason":"unsupported-platform"}' }
- extendedWaitUntil: { visible: { id: displays-graphics-displays-error }, timeout: 10s }
- assertText: { id: displays-graphics-displays-error, equals: SparkError:E_UNSUPPORTED_PLATFORM }
