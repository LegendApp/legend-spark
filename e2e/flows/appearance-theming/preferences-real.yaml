appId: so.legend.spark.examples.kitchensink
name: Appearance preferences read the settings AppKit reports
intent: >
  Appearance & theming > Appearance preferences shows getAppearancePreferences() for a launch whose argument
  domain sets the system appearance to dark and Auto, a red accent, an orange highlight, and increase contrast,
  reduce transparency, reduce motion and differentiate without color on. Launch arguments apply to the driven
  process only (docs/test-driver.md#pinned-host-settings), so the real read path reports them while the Mac's
  settings stay untouched. The colors' exact shades depend on the macOS version, so the flow asserts they are
  sRGB hex; tests/appearance-preferences-native.test.ts checks that these settings change them. Invert colors
  and keyboard navigation cannot be set this way and are not asserted.
checks: [APPR-PREFS-01]
tags: [appearance-theming]
platforms: [macos]
---
- launchApp:
    clearState: true
    openUrl: "spark-ks://appearance-theming/preferences"
    arguments: [-AppleInterfaceStyle, Dark, -AppleInterfaceStyleSwitchesAutomatically, "YES", -AppleAccentColor, "0", -AppleHighlightColor, "1.000000 0.874510 0.701961 Orange",
      -increaseContrast, "YES", -reduceTransparency, "YES", -reduceMotion, "YES", -differentiateWithoutColor, "YES"]
- extendedWaitUntil: { visible: { id: appearance-theming-preferences-appearance }, timeout: 10s }
- assertText: { id: appearance-theming-preferences-availability, equals: '{"available":true}' }
- assertText: { id: appearance-theming-preferences-appearance, equals: dark }
- assertText: { id: appearance-theming-preferences-automaticAppearance, equals: "true" }
- assertVisible: { text: "/^#[0-9a-f]{6}$/", within: { id: appearance-theming-preferences-accentColor } }
- assertVisible: { text: "/^#[0-9a-f]{6}$/", within: { id: appearance-theming-preferences-highlightColor } }
- assertText: { id: appearance-theming-preferences-increaseContrast, equals: "true" }
- assertText: { id: appearance-theming-preferences-reduceTransparency, equals: "true" }
- assertText: { id: appearance-theming-preferences-reduceMotion, equals: "true" }
- assertText: { id: appearance-theming-preferences-differentiateWithoutColor, equals: "true" }
- assertVisible: { text: "/^(true|false)$/", within: { id: appearance-theming-preferences-invertColors } }
- assertVisible: { text: "/^(true|false)$/", within: { id: appearance-theming-preferences-keyboardNavigation } }
- takeScreenshot: appearance-preferences-real
- assertNotVisible: { id: appearance-theming-preferences-error }
