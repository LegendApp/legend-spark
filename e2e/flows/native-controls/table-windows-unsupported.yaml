appId: so.legend.spark.examples.kitchensink
name: Table and Outline are typed unsupported on Windows
intent: >
  On Windows, getTableAvailability() reports unsupported-platform, and the Table and Outline screens
  show SparkError:E_UNSUPPORTED_PLATFORM where the view would be, with no substitute. The Windows
  implementation is tracked in #294.
checks: [CTRL-TABLE-02]
tags: [native-controls]
platforms: [windows]
---
- launchApp: { clearState: true, openUrl: "spark-ks://native-controls/table" }
- extendedWaitUntil: { visible: { id: native-controls-table-root }, timeout: 10s }
- assertText: { id: native-controls-table-availability, equals: '{"available":false,"reason":"unsupported-platform"}' }
- assertText: { id: native-controls-table-list-error, equals: SparkError:E_UNSUPPORTED_PLATFORM }
- launchApp: { stopApp: false, openUrl: "spark-ks://native-controls/outline" }
- extendedWaitUntil: { visible: { id: native-controls-outline-root }, timeout: 10s }
- assertText: { id: native-controls-outline-availability, equals: '{"available":false,"reason":"unsupported-platform"}' }
- assertText: { id: native-controls-outline-list-error, equals: SparkError:E_UNSUPPORTED_PLATFORM }
