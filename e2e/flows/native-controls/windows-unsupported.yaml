appId: so.legend.spark.examples.kitchensink
name: Control primitives are typed unsupported on Windows
intent: >
  On Windows, every control primitive reports unsupported-platform from getControlAvailability
  and rendering it shows SparkError:E_UNSUPPORTED_PLATFORM in place of the control, with no
  substitute. AppKit-only button styles are unsupported too; a button without a variant still
  works. WinUI implementations are tracked in #228.
checks: [CTRL-UNSUP-01]
tags: [native-controls]
platforms: [windows]
---
- launchApp: { clearState: true, openUrl: "spark-ks://native-controls/toggles" }
- extendedWaitUntil: { visible: { id: native-controls-toggles-root }, timeout: 10s }
- assertText: { id: native-controls-toggles-disabled-error, equals: SparkError:E_UNSUPPORTED_PLATFORM }
- assertText: { id: native-controls-toggles-checkbox-availability, equals: '{"available":false,"reason":"unsupported-platform"}' }
- assertText: { id: native-controls-toggles-checkbox-mini-error, equals: SparkError:E_UNSUPPORTED_PLATFORM }
- assertText: { id: native-controls-toggles-checkbox-small-error, equals: SparkError:E_UNSUPPORTED_PLATFORM }
