appId: so.legend.spark.examples.kitchensink
name: Popover configuration and the off-screen refusal in driver mode
intent: >
  On Native controls > Popover, in driver mode, the behavior, edge, anchor and detachable settings take
  clicks, and Show popover (anchored to the button, then to its measured window rect) sets open to true.
  AppKit shows a popover only from a window on screen and driver-mode windows never are, so the popover
  reports SparkError E_UNAVAILABLE through onError for each anchor (the error readout counts them), reports no shown event, and its React content
  never appears in the main window. popover-black-box.yaml opens it on the black-box backend.
checks: [CTRL-POPOVER-02]
tags: [native-controls]
platforms: [macos]
matrix:
  locale: [en-US, ar]
---
- launchApp: { clearState: true, openUrl: "spark-ks://native-controls/popover" }
- extendedWaitUntil: { visible: { id: native-controls-popover-root }, timeout: 10s }
- assertText: { id: native-controls-popover-availability, equals: '{"available":true}' }
- assertVisible: { id: native-controls-popover-host }
- assertNotVisible: { id: native-controls-popover-host-error }
- assertNotVisible: { id: native-controls-popover-error }
- tapOn: { id: native-controls-popover-behavior.application-defined }
- tapOn: { id: native-controls-popover-edge.trailing }
- tapOn: { id: native-controls-popover-detachable }
- tapOn: { id: native-controls-popover-show }
- assertText: { id: native-controls-popover-open, equals: '{"open":true,"anchor":"view"}' }
- extendedWaitUntil: { visible: { id: native-controls-popover-error, text: '["SparkError:E_UNAVAILABLE"]' }, timeout: 5s }
- assertText: { id: native-controls-popover-events, equals: "[]" }
- assertNotVisible: { id: native-controls-popover-content }
- tapOn: { id: native-controls-popover-anchor-mode.rect }
- assertText: { id: native-controls-popover-open, equals: '{"open":true,"anchor":"rect"}' }
- tapOn: { id: native-controls-popover-show }
# The rect anchor is refused on its own: a second error, not the view anchor's.
- extendedWaitUntil: { visible: { id: native-controls-popover-error, text: '["SparkError:E_UNAVAILABLE","SparkError:E_UNAVAILABLE"]' }, timeout: 5s }
- assertText: { id: native-controls-popover-events, equals: "[]" }
- assertNotVisible: { id: native-controls-popover-content }
