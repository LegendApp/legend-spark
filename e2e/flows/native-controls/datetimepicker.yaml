appId: so.legend.spark.examples.kitchensink
name: "@react-native-community/datetimepicker on macOS"
intent: >
  The Date & time picker screen lays out a date field, a time field and an inline calendar with time for
  15 January 2026 09:30 UTC, matching the approved golden (an unregistered component renders nothing).
checks: [CTRL-DATETIMEPICKER-01]
tags: [native-controls]
platforms: [macos]
matrix: { appearance: [dark], locale: [en] }
---
- launchApp: { clearState: true, openUrl: "spark-ks://native-controls/datetimepicker" }
- extendedWaitUntil: { visible: { id: native-controls-datetimepicker-date-laid-out }, timeout: 10s }
- assertVisible: { id: native-controls-datetimepicker-time-laid-out }
- assertVisible: { id: native-controls-datetimepicker-inline-laid-out }
- assertScreenshot: { golden: native-controls-datetimepicker, mask: [{ id: infra-shell-sidebar }] }
