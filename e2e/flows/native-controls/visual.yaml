appId: so.legend.spark.examples.kitchensink
name: Native controls screens match their goldens
intent: >
  Native controls screens open from their spark-ks:// deep links in the running Kitchen Sink and their roots render.
  Split view, SF Symbols, Search field, Glass and the four size grids (Toggles, Value inputs, Indicators, Button styles)
  match the approved golden for the appearance (light and dark) and locale, with the shell sidebar masked: SF Symbols,
  Glass and the size grids in English and Arabic, Split view and Search field in English only until they mirror in
  right-to-left layouts. The animated progress indicators are masked. The three Sidebar screens mount without crashing
  (#252) but are not compared until their rows fit (#264) and the selected row captures correctly (#265).
checks: [CTRL-VISUAL-01, CTRL-SIDEBAR-01]
tags: [native-controls]
platforms: [macos]
matrix:
  appearance: [light, dark]
  locale: [en, ar]
---
- launchApp: { openUrl: "spark-ks://native-controls/split-view" }
- assertVisible: { id: native-controls-split-view-root }
# Arabic: no golden until the view mirrors in RTL (#256).
- assertScreenshot: { golden: native-controls-split-view, mask: [{ id: infra-shell-sidebar }], when: { matrix: { locale: en } } }
- launchApp: { openUrl: "spark-ks://native-controls/symbol", stopApp: false }
- assertVisible: { id: native-controls-symbol-root }
- assertScreenshot: { golden: native-controls-symbol, mask: [{ id: infra-shell-sidebar }] }
- launchApp: { openUrl: "spark-ks://native-controls/search", stopApp: false }
- assertVisible: { id: native-controls-search-root }
# Arabic: no golden until the view mirrors in RTL (#256).
- assertScreenshot: { golden: native-controls-search, mask: [{ id: infra-shell-sidebar }], when: { matrix: { locale: en } } }
- launchApp: { openUrl: "spark-ks://native-controls/glass", stopApp: false }
- assertVisible: { id: native-controls-glass-root }
- assertScreenshot: { golden: native-controls-glass, mask: [{ id: infra-shell-sidebar }] }
- launchApp: { openUrl: "spark-ks://native-controls/toggles", stopApp: false }
- assertVisible: { id: native-controls-toggles-root }
- assertScreenshot: { golden: native-controls-toggles, mask: [{ id: infra-shell-sidebar }] }
- launchApp: { openUrl: "spark-ks://native-controls/inputs", stopApp: false }
- assertVisible: { id: native-controls-inputs-root }
- assertScreenshot: { golden: native-controls-inputs, mask: [{ id: infra-shell-sidebar }] }
- launchApp: { openUrl: "spark-ks://native-controls/indicators", stopApp: false }
- assertVisible: { id: native-controls-indicators-root }
# The indeterminate bar and the spinner animate.
- assertScreenshot:
    golden: native-controls-indicators
    mask:
      - { id: infra-shell-sidebar }
      - { id: native-controls-indicators-progress-indeterminate-mini }
      - { id: native-controls-indicators-progress-indeterminate-small }
      - { id: native-controls-indicators-progress-indeterminate-regular }
      - { id: native-controls-indicators-progress-indeterminate-large }
      - { id: native-controls-indicators-progress-spinner-mini }
      - { id: native-controls-indicators-progress-spinner-small }
      - { id: native-controls-indicators-progress-spinner-regular }
      - { id: native-controls-indicators-progress-spinner-large }
- launchApp: { openUrl: "spark-ks://native-controls/buttons", stopApp: false }
- assertVisible: { id: native-controls-buttons-root }
- assertScreenshot: { golden: native-controls-buttons, mask: [{ id: infra-shell-sidebar }] }
# No goldens: rows overflow the Sidebar's trailing edge (#264) and the selected row captures black (#265).
- launchApp: { openUrl: "spark-ks://native-controls/sidebar-data-items", stopApp: false }
- assertVisible: { id: native-controls-sidebar-data-items-list }
- launchApp: { openUrl: "spark-ks://native-controls/sidebar-dynamic-heights", stopApp: false }
- assertVisible: { id: native-controls-sidebar-dynamic-heights-list }
- launchApp: { openUrl: "spark-ks://native-controls/sidebar-react-rows", stopApp: false }
- assertVisible: { id: native-controls-sidebar-react-rows-list }
