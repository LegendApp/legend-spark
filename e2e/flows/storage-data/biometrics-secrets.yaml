appId: so.legend.spark.examples.kitchensink
name: Secrets gated by biometry store without a prompt and read after one (simulated)
intent: >
  Each access's secret reads null without a prompt before it is stored. Storing never prompts; reading prompts with the
  screen's reason (fallback none, or password for biometryOrPassword) and returns the value, or the person's
  userCancel. A fingerprint change (enrollmentChanged) removes only the biometryCurrentSet secret, which then reads null.
  While biometrics are locked out a biometryAny secret cannot be stored or read (BiometricError E_UNAVAILABLE lockout)
  and a biometryOrPassword secret still reads with the password. Delete is idempotent. Driver simulation only: no
  prompt appears and no keychain is touched; secret values never leave the app.
checks: [DATA-BIOSECRET-01]
tags: [storage-data]
platforms: [macos]
---
- launchApp: { openUrl: "spark-ks://storage-data/biometrics" }
- assertText: { id: storage-data-biometrics-status, equals: "touchId · biometrics available · password available" }
- tapOn: { id: storage-data-biometrics-secret-biometryCurrentSet-read }
- assertText: { id: storage-data-biometrics-secret-biometryCurrentSet-result, equals: "value: null" }
- assertSimulatedBiometrics: { prompts: 0, secrets: {} }
- tapOn: { id: storage-data-biometrics-secret-biometryCurrentSet-store }
- assertText: { id: storage-data-biometrics-secret-biometryCurrentSet-result, equals: stored }
- tapOn: { id: storage-data-biometrics-secret-biometryAny-store }
- assertText: { id: storage-data-biometrics-secret-biometryAny-result, equals: stored }
- tapOn: { id: storage-data-biometrics-secret-biometryOrPassword-store }
- assertText: { id: storage-data-biometrics-secret-biometryOrPassword-result, equals: stored }
- assertSimulatedBiometrics: { prompts: 0, secrets: { biometryCurrentSet: biometryCurrentSet, biometryAny: biometryAny, biometryOrPassword: biometryOrPassword } }
- simulateBiometrics: { answer: success }
- tapOn: { id: storage-data-biometrics-secret-biometryCurrentSet-read }
- assertText: { id: storage-data-biometrics-secret-biometryCurrentSet-result, equals: "value: secret for biometryCurrentSet" }
- assertSimulatedBiometrics: { prompts: 1, lastOperation: secret, lastReason: unlock the Kitchen Sink demo, lastFallback: none }
- simulateBiometrics: { answer: userCancel }
- tapOn: { id: storage-data-biometrics-secret-biometryAny-read }
- assertText: { id: storage-data-biometrics-secret-biometryAny-result, equals: userCancel }
- simulateBiometrics: { enrollmentChanged: true, answer: success }
- assertSimulatedBiometrics: { secrets: { biometryAny: biometryAny, biometryOrPassword: biometryOrPassword } }
- tapOn: { id: storage-data-biometrics-secret-biometryCurrentSet-read }
- assertText: { id: storage-data-biometrics-secret-biometryCurrentSet-result, equals: "value: null" }
- simulateBiometrics: { biometrics: lockout }
- tapOn: { id: storage-data-biometrics-secret-biometryAny-read }
- assertText: { id: storage-data-biometrics-secret-biometryAny-result, equals: "BiometricError:E_UNAVAILABLE:lockout" }
- tapOn: { id: storage-data-biometrics-secret-biometryAny-store }
- assertText: { id: storage-data-biometrics-secret-biometryAny-result, equals: "BiometricError:E_UNAVAILABLE:lockout" }
- tapOn: { id: storage-data-biometrics-secret-biometryOrPassword-read }
- assertText: { id: storage-data-biometrics-secret-biometryOrPassword-result, equals: "value: secret for biometryOrPassword" }
- assertSimulatedBiometrics: { lastFallback: password }
- tapOn: { id: storage-data-biometrics-secret-biometryOrPassword-delete }
- assertText: { id: storage-data-biometrics-secret-biometryOrPassword-result, equals: deleted }
- tapOn: { id: storage-data-biometrics-secret-biometryOrPassword-delete }
- assertText: { id: storage-data-biometrics-secret-biometryOrPassword-result, equals: deleted }
- assertSimulatedBiometrics: { secrets: { biometryAny: biometryAny } }
- takeScreenshot: biometrics-secrets
