appId: so.legend.spark.examples.kitchensink
name: React DevTools is typed unsupported on Windows
intent: >
  On Windows getDevToolsAvailability reports unsupported-platform, so the React DevTools screen shows its availability
  and no sample component or actions.
checks: [DEVT-UNSUP-04]
tags: [devtools]
platforms: [windows]
---
- launchApp: { openUrl: "spark-ks://devtools/react-devtools" }
- assertText: { id: devtools-react-devtools-availability, equals: '{"available":false,"reason":"unsupported-platform"}' }
- assertVisible: { id: devtools-react-devtools-unavailable }
- assertNotVisible: { id: devtools-react-devtools-sample }
