appId: so.legend.spark.examples.kitchensink
name: DevTools is absent without development JavaScript
intent: >
  The gate's release build, like a dev build running bundled JavaScript, has no development server. The DevTools
  screen reports getDevToolsAvailability as development-only and renders no Open DevTools, probe or exception actions.
checks: [DEVT-AVAIL-01]
tags: [devtools]
platforms: [macos]
---
- launchApp: { openUrl: "spark-ks://devtools/devtools" }
- assertVisible: { id: devtools-devtools-root }
- assertVisible: { id: devtools-devtools-unavailable }
- assertNotVisible: { id: devtools-devtools-shortcut }
- assertNotVisible: { id: devtools-devtools-open-shared }
- assertNotVisible: { id: devtools-devtools-probe }
