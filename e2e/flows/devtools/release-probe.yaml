appId: so.legend.spark.examples.kitchensink
name: A running release build has no debug surface
intent: >
  The release-safety probe relaunches the release build pointed at a decoy development server, waits for its first
  settled UI, and checks the running process: it never connected to the decoy, lsof finds no network socket and no
  bound Unix socket but the driver's channel, its menus have no Developer menu or
  other debug item, none of its JavaScript contains the network inspector, the profiler or React DevTools' backend, and
  none of its native code contains the profiler.
checks: [DEVT-REL-01, DEVT-REL-02, DEVT-REL-03, DEVT-REL-04, DEVT-REL-05, DEVT-REL-06]
tags: [devtools, security]
platforms: [macos]
build: release
timeout: 90s
---
- assertNoDebugSurface
