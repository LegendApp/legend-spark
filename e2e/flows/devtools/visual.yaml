appId: so.legend.spark.examples.kitchensink
name: DevTools screen matches its goldens
intent: >
  DevTools > React Native DevTools opens from its spark-ks:// deep link in the running Kitchen Sink, its root renders,
  and the main window matches the approved golden for the appearance (light and dark, English and Arabic), with the
  shell sidebar masked. The gate's builds have no development server, so the screen shows its unavailable state.
checks: [DEVT-VISUAL-01]
tags: [devtools]
platforms: [macos]
matrix:
  appearance: [light, dark]
  locale: [en, ar]
---
- launchApp: { openUrl: "spark-ks://devtools/devtools" }
- assertVisible: { id: devtools-devtools-unavailable }
- assertScreenshot: { golden: devtools-devtools, mask: [{ id: infra-shell-sidebar }] }
