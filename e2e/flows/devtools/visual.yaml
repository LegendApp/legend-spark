appId: so.legend.spark.examples.kitchensink
name: DevTools screens match their goldens
intent: >
  DevTools > React Native DevTools, DevTools > Network inspector and DevTools > Profiling open from their spark-ks:// deep links in the
  running Kitchen Sink, their roots render, and the main window matches the approved golden for the appearance (light
  and dark, English and Arabic), with the shell sidebar masked. The gate's builds have no development server and run
  JavaScript without __DEV__, so every screen shows its unavailable state.
checks: [DEVT-VISUAL-01, DEVT-VISUAL-02, DEVT-VISUAL-03]
tags: [devtools]
platforms: [macos]
matrix:
  appearance: [light, dark]
  locale: [en, ar]
---
- launchApp: { openUrl: "spark-ks://devtools/devtools" }
- assertVisible: { id: devtools-devtools-unavailable }
- assertScreenshot: { golden: devtools-devtools, mask: [{ id: infra-shell-sidebar }] }
- launchApp: { openUrl: "spark-ks://devtools/network", stopApp: false }
- assertVisible: { id: devtools-network-unavailable }
- assertScreenshot: { golden: devtools-network, mask: [{ id: infra-shell-sidebar }] }
- launchApp: { openUrl: "spark-ks://devtools/profiling", stopApp: false }
- assertVisible: { id: devtools-profiling-unavailable }
- assertScreenshot: { golden: devtools-profiling, mask: [{ id: infra-shell-sidebar }] }
