appId: so.legend.spark.examples.kitchensink
name: react-native-paper on macOS
intent: >
  The Paper screen renders a card, button, chip, switch and text input under a PaperProvider (pressing needs a pointer).
checks: [COMP-PAPER-01]
tags: [component-library]
platforms: [macos]
---
- launchApp: { clearState: true, openUrl: "spark-ks://component-library/paper" }
- extendedWaitUntil: { visible: { id: component-library-paper-card }, timeout: 10s }
- assertVisible: { id: component-library-paper-button }
- assertVisible: { id: component-library-paper-switch }
- takeScreenshot: paper
