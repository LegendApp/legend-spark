appId: so.legend.spark.examples.kitchensink
name: React Native Modal on macOS
intent: >
  The RN Modal screen opens a transparent fading Modal on mount: onShow fires and its content shows over the window.
  Escape fires onRequestClose (needs real key input; checked by hand).
checks: [COMP-RNMODAL-01]
tags: [component-library]
platforms: [macos]
---
- launchApp: { clearState: true, openUrl: "spark-ks://component-library/rn-modal" }
- extendedWaitUntil: { visible: { id: component-library-rn-modal-shown-1-closes-0 }, timeout: 10s }
- assertVisible: { id: component-library-rn-modal-content }
- takeScreenshot: rn-modal
