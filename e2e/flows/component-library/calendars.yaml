appId: so.legend.spark.examples.kitchensink
name: react-native-calendars on macOS
intent: >
  The Calendars screen renders November 2026 with its header and day cells (selecting a day needs a pointer).
checks: [COMP-CALENDARS-01]
tags: [component-library]
platforms: [macos]
---
- launchApp: { clearState: true, openUrl: "spark-ks://component-library/calendars" }
- extendedWaitUntil: { visible: { id: component-library-calendars.day_2026-11-16 }, timeout: 10s }
- assertVisible: { id: component-library-calendars.header }
- takeScreenshot: calendars
