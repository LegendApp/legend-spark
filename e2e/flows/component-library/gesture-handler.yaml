appId: so.legend.spark.examples.kitchensink
name: react-native-gesture-handler on macOS
intent: >
  The Gesture handler screen finds the native module and RNGestureHandlerButton registered, and its
  GestureDetector mounts inside a GestureHandlerRootView. Tapping and dragging the blue area (a pointer
  is needed, so by hand) logs tap and pan events.
checks: [COMP-GESTURE-01]
tags: [component-library]
platforms: [macos]
manual: partial
---
- launchApp: { clearState: true, openUrl: "spark-ks://component-library/gesture-handler" }
- extendedWaitUntil: { visible: { id: component-library-gesture-handler-native }, timeout: 10s }
- assertVisible: { id: component-library-gesture-handler-root-laid-out }
- takeScreenshot: gesture-handler
