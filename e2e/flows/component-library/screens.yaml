appId: so.legend.spark.examples.kitchensink
name: react-native-screens on macOS
intent: >
  The Screens screen renders a ScreenContainer with an active and an inactive Screen, and a ScreenStack
  with one Screen. The active and stack screens lay out; the inactive one does not.
checks: [COMP-SCREENS-01]
tags: [component-library]
platforms: [macos]
---
- launchApp: { clearState: true, openUrl: "spark-ks://component-library/screens" }
- extendedWaitUntil: { visible: { id: component-library-screens-first-visible }, timeout: 10s }
- assertVisible: { id: component-library-screens-stack-visible }
- assertNotVisible: { id: component-library-screens-second-visible }
- takeScreenshot: screens
