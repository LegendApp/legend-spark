appId: so.legend.spark.examples.kitchensink
name: recyclerlistview on macOS
intent: >
  The RecyclerListView screen sizes a 500-row list to the window; the first row is visible and the last is not rendered.
checks: [COMP-RECYCLER-01]
tags: [component-library]
platforms: [macos]
---
- launchApp: { clearState: true, openUrl: "spark-ks://component-library/recyclerlistview" }
- extendedWaitUntil: { visible: { id: component-library-recyclerlistview-row-0 }, timeout: 10s }
- assertNotVisible: { id: component-library-recyclerlistview-row-499 }
