appId: so.legend.spark.examples.kitchensink
name: Menu audit screen matches its golden
intent: >
  Menus > Application menu audit opens from spark-ks://menus/audit in the running Kitchen Sink, its root renders,
  and the main window matches the approved golden for the appearance (light and dark, English and Arabic), with the shell
  sidebar masked.
checks: [MENU-VISUAL-01]
tags: [menus]
platforms: [macos]
matrix:
  appearance: [light, dark]
  locale: [en, ar]
---
- launchApp: { openUrl: "spark-ks://menus/audit" }
- assertVisible: { id: menus-audit-root }
- assertScreenshot: { golden: menus-audit, mask: [{ id: infra-shell-sidebar }] }
