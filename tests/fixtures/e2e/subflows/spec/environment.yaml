- setAppearance: dark
- setAppAppearance: dark                    # in-app override (driver); setAppearance changes the OS
- setAccentColor: purple
- setAccessibility: { reduceMotion: true, increaseContrast: true, reduceTransparency: true, textScale: 1.5 }
- setLocale: { language: ar, region: EG, calendar: gregorian, clock: 24h }
- setTimeZone: Asia/Tokyo
- setSystemClock: "+3d"
- setDisplays: [{ id: 1, scale: 2 }, { id: 2, scale: 1.5, refresh: 60, arrangement: rightOf }]
- simulateDisplays: { restore: true }        # driver; displays: [DisplayDetails…] replaces what @legendapp/spark/displays reports
- unplugDisplay: 2
- sleepSystem: { for: 30s }
- simulatePower: { source: battery, lowPower: true, thermal: serious }
- setNetwork: { offline: true }             # latency, bandwidth, proxy
- lockScreen: { for: 5s }
- simulateSystemEvent: sleep               # in-app event (driver); sleepSystem and lockScreen change the OS
- simulateSystemEvent: { type: thermalChanged, thermal: serious }
- permission: { reset: camera }             # grant | revoke | reset
- simulatePermission: { kind: camera, authorization: notDetermined, answer: allow }   # driver; never reaches TCC
- assertSimulatedPermission: { kind: camera, authorization: authorized, requests: 1, prompts: 1, settingsOpened: 0 }
- simulateBiometrics: { biometrics: lockout, answer: userCancel }   # driver; never shows a Touch ID prompt
- assertSimulatedBiometrics: { prompts: 1, lastFallback: password, secrets: { vault: biometryCurrentSet } }
- setFocusMode: doNotDisturb
