- setAppearance: dark
- setAppAppearance: dark                    # in-app override (driver); setAppearance changes the OS
- setAccentColor: purple
- setAccessibility: { reduceMotion: true, increaseContrast: true, reduceTransparency: true, textScale: 1.5 }
- setLocale: { language: ar, region: EG, calendar: gregorian, clock: 24h }
- setTimeZone: Asia/Tokyo
- setSystemClock: "+3d"
- setDisplays: [{ id: 1, scale: 2 }, { id: 2, scale: 1.5, refresh: 60, arrangement: rightOf }]
- simulateDisplays: { restore: true }        # driver; displays: [DisplayDetails…] replaces what @legendapp/spark/displays reports
- unplugDisplay: 2
- sleepSystem: { for: 30s }
- simulatePower: { source: battery, lowPower: true, thermal: serious }
- setNetwork: { offline: true }             # latency, bandwidth, proxy
- lockScreen: { for: 5s }
- simulateSystemEvent: sleep               # in-app event (driver); sleepSystem and lockScreen change the OS
- simulateSystemEvent: { type: thermalChanged, thermal: serious }
- permission: { reset: camera }             # grant | revoke | reset
- simulatePermission: { kind: camera, authorization: notDetermined, answer: allow }   # driver; never reaches TCC
- assertSimulatedPermission: { kind: camera, authorization: authorized, requests: 1, prompts: 1, settingsOpened: 0 }
- simulateBiometrics: { biometrics: lockout, answer: userCancel }   # driver; never shows a Touch ID prompt
- assertSimulatedBiometrics: { prompts: 1, lastFallback: password, secrets: { vault: biometryCurrentSet } }
- simulateAuthorization: { appleId: true, webCredentials: [example.com], answer: success }   # driver; never presents a sheet
- assertSimulatedAuthorization: { requests: 1, lastOperation: appleId, lastWindow: spark.main, passkeys: 0 }
- simulatePrivilegedHelper: { signed: true, helpers: { tool: notRegistered }, approval: granted, promptAnswer: authorized, connection: accept }   # driver; nothing is registered, prompted or run as root
- assertSimulatedPrivilegedHelper: { registrations: 1, unregistrations: 0, settingsOpened: 0, prompts: 1, lastPrompt: Why, authorizations: 1, messages: 1, lastHelper: tool, lastAuthorized: true, helpers: { tool: enabled } }
- simulateSharing: { shareAnswer: Mail, services: [Show], invokeService: { name: Show, text: hi }, openSpotlightItem: recipe-1, openUniversalLink: "https://example.com/a" }   # driver; no picker, index or pbs
- assertSharing: { shares: 1, lastShare: { items: [{ type: text, text: Hi }], anchored: true, service: Mail }, indexed: [recipe-1], registered: [Show], invocations: 1 }
- simulateSpeech: { wordMs: 50, recognitionPartials: [hello], recognitionTranscript: hello world }   # driver; nothing is spoken or heard
- assertSimulatedSpeech: { utterances: 1, lastText: Hello, lastRate: 1, listening: false }
- simulateAppIntents: { intents: [{ id: show, title: Show, returnsText: true, parameters: [{ name: n, title: N, type: integer, optional: true }] }], invoke: { id: show, parameters: { n: 2 }, timeoutMs: 1000 } }   # driver; nothing reaches the system
- assertAppIntents: { registered: [show], invocations: 1, pending: 0, lastInvocation: { id: show, parameters: { n: 2 }, text: Two, error: null }, donations: 1, lastDonation: { id: show, parameters: { n: 1 } } }
- simulateAppIntents: { entities: [{ id: Note, title: Note }], query: { entity: Note, kind: identifiers, identifiers: [n1], timeoutMs: 1000 } }   # driver; nothing reaches the system
- assertAppIntents: { registeredEntities: [Note], queries: 1, lastQuery: { entity: Note, kind: identifiers, entities: [n1], error: null } }
- simulateCapture: { cameras: true, microphones: false }   # driver; no device, ScreenCaptureKit or TCC
- assertSimulatedCapture: { cameraRunning: true, photos: 1, minFrames: 10 }
- setFocusMode: doNotDisturb
